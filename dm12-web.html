<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepMind 12 — Controller (pc)</title>
<style>
  :root {
    --bg:#14161a; --panel:#1d2026; --panel2:#23272e; --border:#32363e;
    --text:#e8eaed; --muted:#8a919c; --accent:#4da3ff; --accent-dim:#2a5a8f;
    --active:#ffb547; --star:#ffd24d; --ok:#6fd487; --bad:#ff7b72; --radius:10px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
    padding:0 10px 24px; font-size:14px; }

  /* ---- kop ---- */
  #topbar { position:sticky; top:0; z-index:20; background:var(--bg); padding:8px 0 0;
    border-bottom:1px solid var(--border); }
  .row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  #led { width:14px; height:14px; border-radius:50%; background:var(--bad); flex:none;
    box-shadow:0 0 6px rgba(255,123,114,.6); }
  #led.wifi { background:var(--active); box-shadow:0 0 6px rgba(255,181,71,.6); }
  #led.ok { background:var(--ok); box-shadow:0 0 8px rgba(111,212,135,.7); }
  #statusText { flex:1; min-width:0; font-size:12px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  select, input[type="text"], button {
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius); padding:8px 10px; font-size:13px; outline:none; }
  select:focus, input:focus { border-color:var(--accent); }
  button { cursor:pointer; transition:background .08s, border-color .08s, transform .08s; }
  button:active { background:var(--accent-dim); border-color:var(--accent); color:#fff;
    transform:scale(.96); }
  /* knippert kort na een actie, zodat je ziet dat er iets verstuurd is */
  button.flash { background:var(--accent-dim); border-color:var(--accent); color:#fff; }
  button.mini { padding:6px 8px; font-size:12px; }
  #autoBtn.on { background:#1e4d2b; border-color:var(--ok); color:#fff; }
  #settings input { flex:1; min-width:70px; }
  #tabs { display:flex; gap:5px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; padding:8px 12px; font-size:13px; white-space:nowrap; }
  .tab.sel { background:var(--accent-dim); border-color:var(--accent); color:#fff; }

  /* ---- presets ---- */
  .banks { display:flex; gap:5px; margin:10px 0; flex-wrap:wrap; }
  .bank-btn { flex:1; min-width:38px; padding:10px 0; text-align:center; font-weight:600; }
  .bank-btn.sel { background:var(--accent-dim); border-color:var(--accent); color:#fff; }
  .bank-btn.fav.sel { background:#5c4a15; border-color:var(--star); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:8px; }
  .prog { position:relative; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 10px 8px; cursor:pointer; user-select:none; min-height:60px; }
  .prog:active { background:var(--panel2); border-color:var(--accent); }
  .prog.current { border-color:var(--active); background:#2c2415; }
  .prog .num { font-size:11px; color:var(--muted); }
  .prog.current .num { color:var(--active); }
  .prog .name { margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prog .name input { width:100%; padding:3px; font-size:13px; border-radius:6px; }
  .prog .star { position:absolute; top:2px; right:2px; font-size:15px; padding:6px; color:var(--border); }
  .prog .star.on { color:var(--star); }
  .prog .cat { font-size:10px; color:var(--accent); text-transform:uppercase; }

  /* ---- parameters ---- */
  .phead { margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--accent);
    text-transform:uppercase; letter-spacing:.5px; }
  .p { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 10px; margin-bottom:6px; }
  .p .plab { display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:2px; }
  .p .pval { color:var(--accent); font-variant-numeric:tabular-nums; }
  .p input[type=range] { width:100%; height:26px; accent-color:var(--accent); background:transparent; }
  .p select { width:100%; margin-top:4px; }
  .p .tog { width:100%; margin-top:4px; }
  .p .tog.on { background:var(--accent-dim); border-color:var(--accent); color:#fff; }

  /* ---- bibliotheek ---- */
  .lrow { display:flex; align-items:center; gap:6px; background:var(--panel);
    border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px; margin-bottom:5px; }
  .lrow .lnum { font-size:11px; color:var(--muted); width:38px; flex:none; }
  .lrow .lname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .lcat { font-size:10px; color:var(--accent); text-transform:uppercase; flex:none; }
  .lrow .dotp { width:7px; height:7px; border-radius:50%; background:var(--border); flex:none; }
  .lrow .dotp.has { background:var(--ok); }
  .note { font-size:12px; color:var(--muted); line-height:1.6; margin:8px 0; }
  /* eigen dialoog: een WebView negeert confirm() en alert() */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  #modal .box { background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:16px; max-width:420px; width:100%; }
  #modalText { font-size:14px; line-height:1.5; margin-bottom:14px; white-space:pre-line; }
  .grow { flex:1; }
  .gchanged { border-color:var(--active); background:#2c2415; }
  .gname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ghead { display:flex; align-items:center; gap:6px; margin:12px 0 4px; font-size:12px;
    font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  .ghead .gtitle { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ghead input { text-transform:none; font-weight:400; flex:1; }
  .p.changed { border-color:var(--active); background:#2c2415; }
  .p select, .p input[type=number] { width:auto; flex:1; min-width:70px; margin:0; }
  .p .row { margin:6px 0 0; }
  .gval { color:var(--accent); font-variant-numeric:tabular-nums; width:34px; text-align:right; }
  .lrow input[type=number] { width:64px; padding:6px; }
  .warn { color:var(--active); }
  .empty { color:var(--muted); padding:26px; text-align:center; }
  footer { margin-top:18px; font-size:11px; color:var(--muted); line-height:1.6; }
</style>
</head>
<body>

<div id="topbar">
  <div class="row">
    <span id="led" title="verbindingsstatus"></span>
    <span id="statusText">verbinden…</span>
    <button class="mini" id="gearBtn" title="instellingen">⚙</button>
  </div>
  <div id="settings" style="display:none">
    <div class="row">
      <input type="text" id="ipInput" placeholder="MIDI-poort (deel van de naam)">
      <button class="mini" id="ipBtn">Verbind</button>
      <button class="mini" id="findBtn">Zoek</button>
      <label style="font-size:12px;color:var(--muted)">Kan.</label>
      <select id="midiCh"></select>
    </div>
    <div class="row" id="foundRow" style="display:none;flex-wrap:wrap"></div>
    <div class="row">
      <span style="font-size:12px;color:var(--muted)">Verbinding via USB of rtpMIDI — kies hierboven de MIDI-poort.</span><input type="text" id="ssidInput" style="display:none"><input type="text" id="pwInput" style="display:none"><button class="mini" id="wifiBtn" style="display:none"></button><button class="mini" id="wifiOffBtn" style="display:none"></button>
    </div>
    <div class="row">
      <button class="mini" id="notifyBtn">Aanmelden bij synth</button>
      <button class="mini" id="panicBtn">Panic</button>
      <span id="devInfo" style="font-size:11px;color:var(--muted)"></span>
    </div>
  </div>
  <div id="tabs"></div>
</div>

<div id="page-presets">
  <div class="row"><input type="text" id="search" placeholder="Zoek preset…" style="flex:1">
    <button class="mini" id="backupBtn">Back-up</button>
    <button class="mini" id="restoreBtn">Herstel</button></div>
  <div class="banks" id="bankTabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="modal" style="display:none">
  <div class="box">
    <div id="modalText"></div>
    <input type="text" id="modalInput" style="display:none;width:100%;margin-bottom:12px">
    <div class="row" style="justify-content:flex-end;margin:0">
      <button id="modalNo">Annuleren</button>
      <button id="modalYes">Doorgaan</button>
    </div>
  </div>
</div>

<div id="page-global" style="display:none">
  <div class="row" style="flex-wrap:wrap">
    <button class="mini" id="gReadBtn">Lees uit synth</button>
    <button class="mini" id="gNewMenu">Nieuw menu</button>
    <button class="mini" id="gExportBtn">Exporteer indeling</button>
    <button class="mini" id="gImportBtn">Importeer</button>
    <button class="mini" id="gHelpBtn">Uitleg</button>
  </div>
  <div class="note" id="gStat">Nog niet uitgelezen.</div>
  <div id="gList"></div>
</div>

<div id="page-lib" style="display:none">
  <div class="row" style="flex-wrap:wrap">
    <button class="mini" id="scanNames">Scan alle namen</button>
    <button class="mini" id="scanBankPatches">Haal patches van bank</button>
    <button class="mini" id="libSaveBtn">Opslaan</button>
    <button class="mini" id="libExportBtn">Exporteer</button>
  </div>
  <div class="note" id="libStat">—</div>
  <div class="banks" id="libBanks"></div>
  <div id="libList"></div>
</div>

<div id="page-params" style="display:none">
  <div class="row">
    <button class="mini" id="readBtn">Lees synth uit</button>
    <button class="mini" id="pushBtn">Stuur pagina</button>
    <button class="mini" id="autoBtn" title="blijf de synth volgen">Auto</button>
    <span id="paramNote" style="font-size:11px;color:var(--muted);flex:1"></span>
  </div>
  <div id="paramList"></div>
</div>

<footer id="foot">v1.11 (pc-versie via Web MIDI) · Chrome of Edge, sta MIDI met SysEx toe. · Zet op de synth <i>GLOBAL → MIDI SETTINGS → PROGRAM CHANGE</i> op <i>Rx</i>/<i>Both</i>.</footer>

<script>
/*
 * Verbindingslaag voor de pc-versie: dezelfde interface als de Android-app,
 * maar bovenop Web MIDI in plaats van AppleMIDI over WiFi.
 *
 * De app spreekt met de synth via één object (AndroidBridge). Door dat hier na
 * te bouwen werkt de complete interface -- presets, editor, bibliotheek en de
 * globale instellingen -- ongewijzigd in Chrome of Edge op de pc.
 *
 * Verbinding met de synth: via USB, of over WiFi met rtpMIDI erbij als
 * netwerkpoort. Web MIDI levert SysEx als complete berichten, dus het in delen
 * knippen dat op Android nodig was speelt hier niet.
 */
(function () {
  "use strict";

  const BANKS = ["A", "B", "C", "D", "E", "F", "G", "H"];
  const PROGRAM_BYTES = 242;
  const GLOBAL_BYTES = 45;
  const NAME_OFFSET = 223, NAME_LEN = 16, CATEGORY_OFFSET = 240;

  // CC's uit de implementatietabel naar parameternummers; alleen de doorlopende
  // 0-255 parameters, net als in de Android-versie.
  const CC2P = {5:34, 12:157, 13:160, 16:0, 17:1, 18:7, 19:8, 20:21, 21:25, 23:29,
    24:28, 25:27, 26:26, 27:33, 28:87, 29:39, 30:41, 31:42, 33:45, 34:49, 35:40,
    36:80, 37:53, 39:54, 40:55, 41:56, 42:62, 43:63, 44:64, 45:65, 46:71, 47:72,
    48:73, 49:74, 50:58, 51:59, 52:60, 53:61, 54:67, 55:68, 56:69, 57:70, 58:76,
    59:77, 60:78, 61:79,
    62:167, 63:168, 65:169, 66:170, 67:171, 68:172, 69:173, 70:174, 71:175, 72:176,
    73:177, 74:178,
    75:180, 76:181, 77:182, 78:183, 79:184, 80:185, 81:186, 82:187, 83:188, 84:189,
    85:190, 86:191,
    87:193, 88:194, 89:195, 90:196, 91:197, 92:198, 93:199, 94:200, 95:201,
    102:202, 103:203, 104:204};

  const S = {
    status: "MIDI wordt geladen…", connected: false, portName: "",
    names: {}, cats: {}, patches: {},
    editBuffer: null, globals: null, prevGlobals: null, globalsPacked: null,
    paramRev: 0, globalRev: 0, nameDumps: 0, patchDumps: 0, badNames: 0,
    rxCC: 0, rxPar: 0, rxLast: "", dev: -1, curBank: -1, curProg: -1, iface: -1,
    sysex: 0, sysexLen: 0, pkts: 0, info: "",
  };

  let midi = null, out = null, preferred = "";
  let rxParamMsb = 0, rxParamLsb = 0, rxDataMsb = 0;

  // "midi"   = rechtstreeks via Web MIDI (USB of rtpMIDI)
  // "bridge" = via dm12-bridge.py, die de RTP-MIDI-sessie over het netwerk doet
  let mode = "";
  let bridgeSeq = 0, pending = [], flushTimer = null, chain = Promise.resolve();
  const disco = {running: false, found: [], status: ""};
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const hex = b => Array.from(b).map(x => x.toString(16).padStart(2, "0")).join("");
  const unhex = s => {
    const o = [];
    for (let i = 0; i + 1 < s.length; i += 2) o.push(parseInt(s.substr(i, 2), 16));
    return o;
  };

  // ---------- codering ----------

  function unpack7(src, off, end, max) {
    const o = [];
    let i = off;
    while (i < end && o.length < max) {
      const msbs = src[i++];
      for (let j = 0; j < 7 && i < end && o.length < max; j++) {
        o.push((src[i++] & 0x7F) | (((msbs >> j) & 1) << 7));
      }
    }
    return o;
  }

  /** Verandert één databyte binnen ingepakte data; de rest blijft identiek. */
  function setPackedByte(packed, index, value) {
    const group = Math.floor(index / 7), pos = index % 7;
    const msbAt = group * 8, at = msbAt + 1 + pos;
    if (at >= packed.length) return;
    packed[at] = value & 0x7F;
    if (value & 0x80) packed[msbAt] |= (1 << pos);
    else packed[msbAt] &= ~(1 << pos) & 0xFF;
  }

  /** Tekst uit databytes; null als er onleesbare tekens in staan. */
  function text(d, off, len) {
    let s = "";
    for (let i = 0; i < len && off + i < d.length; i++) {
      const c = d[off + i];
      if (c === 0) break;
      if (c < 0x20 || c > 0x7E) return null;
      s += String.fromCharCode(c);
    }
    return s.trim();
  }

  // ---------- ontvangen ----------

  function setParam(p, v) {
    if (!S.editBuffer) S.editBuffer = new Array(PROGRAM_BYTES).fill(0);
    if (p >= 0 && p < PROGRAM_BYTES) S.editBuffer[p] = v;
    S.paramRev++;
    S.rxPar++;
    S.rxLast = "par " + p + " = " + v;
  }

  function onCC(cc, v) {
    S.rxCC++;
    if (cc !== 99 && cc !== 98 && cc !== 6 && cc !== 38) S.rxLast = "CC " + cc + " = " + v;
    if (cc === 99) { rxParamMsb = v; rxDataMsb = 0; }
    else if (cc === 98) { rxParamLsb = v; rxDataMsb = 0; }
    else if (cc === 6) { rxDataMsb = v; }
    else if (cc === 38) { setParam((rxParamMsb << 7) | rxParamLsb, (rxDataMsb << 7) | v); }
    else if (CC2P[cc] !== undefined) { setParam(CC2P[cc], Math.round(v * 255 / 127)); }
  }

  function handleSysEx(d) {
    S.sysex++;
    S.sysexLen = d.length;
    if (d.length < 8 || d[0] !== 0xF0) return;
    if (!(d[1] === 0x00 && d[2] === 0x20 && d[3] === 0x32 && d[4] === 0x20)) return;
    S.dev = d[5] & 0x0F;
    const cmd = d[6], end = d.length - 1;

    if (cmd === 0x0B) {                       // banknamen
      const bank = d[8] & 7;
      const data = unpack7(d, 9, end, 128 * NAME_LEN);
      let good = 0, bad = 0;
      for (let p = 0; p < 128 && (p + 1) * NAME_LEN <= data.length; p++) {
        const nm = text(data, p * NAME_LEN, NAME_LEN);
        if (nm === null) { bad++; continue; }
        if (nm) { S.names[BANKS[bank] + "-" + p] = nm; good++; }
      }
      S.nameDumps++;
      S.badNames += bad;
      S.info = "bank " + BANKS[bank] + ": " + good + " namen"
             + (bad ? ", " + bad + " onleesbaar" : "");
    } else if (cmd === 0x02) {                // programma-dump
      const bank = d[8] & 7, prog = d[9] & 0x7F;
      S.patches[bank + "-" + prog] = Array.from(d.slice(10, end));
      const data = unpack7(d, 10, end, PROGRAM_BYTES);
      if (data.length > CATEGORY_OFFSET) {
        const nm = text(data, NAME_OFFSET, NAME_LEN);
        if (nm) S.names[BANKS[bank] + "-" + prog] = nm;
        S.cats[BANKS[bank] + "-" + prog] = data[CATEGORY_OFFSET];
      }
      S.patchDumps++;
      S.info = "patch " + BANKS[bank] + (prog + 1) + " ontvangen";
    } else if (cmd === 0x04) {                // edit buffer
      S.editBuffer = unpack7(d, 8, end, PROGRAM_BYTES);
      S.paramRev++;
      S.info = "edit buffer ontvangen (" + S.editBuffer.length + " bytes)";
    } else if (cmd === 0x06) {                // globale instellingen
      S.prevGlobals = S.globals;
      S.globals = unpack7(d, 8, end, GLOBAL_BYTES);
      S.globalsPacked = Array.from(d.slice(8, end));
      S.globalRev++;
      S.info = "globale instellingen ontvangen (" + S.globals.length + " bytes)";
    } else if (cmd === 0x10) {                // aanmelding bevestigd
      S.iface = d[9] & 0x7F;
      S.curBank = d[10] & 7;
      S.curProg = d[11] & 0x7F;
      S.info = "synth meldt zich: bank " + BANKS[S.curBank] + (S.curProg + 1);
    } else {
      S.info = "SysEx 0x" + cmd.toString(16) + " ontvangen";
    }
  }

  function handleBytes(d) {
    S.pkts++;
    if (d[0] === 0xF0) handleSysEx(d);
    else if ((d[0] & 0xF0) === 0xB0) onCC(d[1], d[2]);
    else if ((d[0] & 0xF0) === 0xC0) { S.curProg = d[1]; }
  }

  function onMessage(e) { handleBytes(e.data); }

  // ---------- verbinding ----------

  function pickPorts() {
    if (!midi) return;
    const outs = [...midi.outputs.values()];
    out = (preferred && outs.find(o => o.name.toLowerCase().includes(preferred)))
       || outs.find(o => /deepmind/i.test(o.name))
       || outs[0] || null;
    for (const i of midi.inputs.values()) i.onmidimessage = onMessage;
    S.connected = !!out;
    S.portName = out ? out.name : "";
    S.status = out ? "verbonden: " + out.name
                   : "geen MIDI-uitgang gevonden — sluit de DeepMind aan via USB of start rtpMIDI";
  }

  function initWebMidi() {
    mode = "midi";
    if (typeof navigator === "undefined" || !navigator.requestMIDIAccess) {
      S.status = "deze browser ondersteunt geen Web MIDI — gebruik Chrome of Edge,"
               + " of start dm12-bridge.py";
      return;
    }
    navigator.requestMIDIAccess({sysex: true}).then(access => {
      midi = access;
      midi.onstatechange = pickPorts;
      pickPorts();
    }, () => {
      S.status = "MIDI-toegang geweigerd (SysEx moet toegestaan zijn)";
    });
  }

  // ---------- netwerkbrug ----------

  function startBridge() {
    mode = "bridge";
    S.status = "netwerkbrug gevonden";
    (async () => {
      for (;;) {
        try {
          const d = await (await fetch("/status")).json();
          S.connected = !!d.connected;
          S.status = d.status;
          S.portName = d.ip;
          S.pkts = d.packets || 0;
          S.info = d.framing ? "uitlijnfouten: " + d.framing : S.info;
        } catch {
          S.connected = false;
          S.status = "netwerkbrug niet bereikbaar";
        }
        await sleep(1500);
      }
    })();
    (async () => {
      for (;;) {
        try {
          const d = await (await fetch("/recv?since=" + bridgeSeq + "&wait=1")).json();
          bridgeSeq = d.next;
          for (const h of d.msgs) handleBytes(unhex(h));
        } catch {
          await sleep(700);
        }
      }
    })();
  }

  function flushPending() {
    const body = pending.join("\n");
    pending = [];
    if (!body) return;
    // aan elkaar geregen, zodat de volgorde van berichten gegarandeerd blijft
    chain = chain.then(() => fetch("/midi", {method: "POST", body}).catch(() => {}));
  }

  function init() {
    // wordt deze pagina door de netwerkbrug geserveerd? Dan die gebruiken.
    if (typeof location !== "undefined" && /^https?:$/.test(location.protocol)
        && typeof fetch === "function") {
      fetch("/status").then(r => r.json()).then(d => {
        if (d && d.transport === "bridge") startBridge();
        else initWebMidi();
      }).catch(() => initWebMidi());
    } else {
      initWebMidi();
    }
  }

  function send(bytes) {
    if (mode === "bridge") {
      pending.push(hex(bytes));
      if (!flushTimer) {
        flushTimer = setTimeout(() => { flushTimer = null; flushPending(); }, 8);
      }
      return S.connected;
    }
    if (!out) return false;
    try { out.send(bytes); return true; } catch { return false; }
  }

  function sysexMsg(dev, cmd, rest) {
    return [0xF0, 0x00, 0x20, 0x32, 0x20, dev & 0x0F, cmd].concat(rest || []).concat([0xF7]);
  }

  function clip(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
      return;
    }
    const t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); } catch {}
    document.body.removeChild(t);
  }

  // ---------- dezelfde interface als op Android ----------

  window.AndroidBridge = {
    getStatus: () => JSON.stringify({
      connected: S.connected, status: S.status, event: "",
      wifi: "", wifiConnected: false, ip: S.portName,
    }),

    libStatus: () => JSON.stringify({
      names: Object.keys(S.names).length,
      patches: Object.keys(S.patches).length,
      nameDumps: S.nameDumps, patchDumps: S.patchDumps, badNames: S.badNames,
      curBank: S.curBank, curProg: S.curProg, iface: S.iface, dev: S.dev,
      editBuffer: !!S.editBuffer, paramRev: S.paramRev, globalRev: S.globalRev,
      rxCC: S.rxCC, rxPar: S.rxPar, rxLast: S.rxLast, info: S.info,
      pkts: S.pkts, sysex: S.sysex, sysexLen: S.sysexLen, segs: S.sysex, framing: 0,
    }),

    libNames: () => {
      const o = {};
      for (const k in S.names) {
        const [b, p] = k.split("-");
        o[k] = [S.names[k], S.cats[k] === undefined ? -1 : S.cats[k],
                S.patches[BANKS.indexOf(b) + "-" + p] ? 1 : 0];
      }
      return JSON.stringify(o);
    },

    libParams: () => JSON.stringify(S.editBuffer),
    globals: () => JSON.stringify(S.globals ? {
      rev: S.globalRev, bytes: S.globals, hadPrevious: !!S.prevGlobals,
      changed: S.prevGlobals
        ? S.globals.map((v, i) => v !== S.prevGlobals[i] ? i : -1).filter(i => i >= 0)
        : [],
    } : null),

    send: (bank, prog, ch) => send([0xB0 | ch, 0x00, 0x00])
        && send([0xB0 | ch, 0x20, bank]) && send([0xC0 | ch, prog]),
    sendCC: (cc, v, ch) => send([0xB0 | ch, cc & 0x7F, v & 0x7F]),
    sendNRPN: (p, v, ch) => send([0xB0 | ch, 99, (p >> 7) & 0x7F])
        && send([0xB0 | ch, 98, p & 0x7F])
        && send([0xB0 | ch, 6, (v >> 7) & 0x7F])
        && send([0xB0 | ch, 38, v & 0x7F]),
    panic: ch => send([0xB0 | ch, 123, 0]) && send([0xB0 | ch, 120, 0]),

    appNotify: dev => {
      if (dev < 0) {
        let ok = false;
        for (let i = 0; i < 16; i++) ok = send(sysexMsg(i, 0x00, [0x00])) || ok;
        return ok;
      }
      return send(sysexMsg(dev, 0x00, [0x00]));
    },
    requestBankNames: (bank, dev) => send(sysexMsg(dev, 0x0A, [bank & 7])),
    requestProgram: (bank, prog, dev) => send(sysexMsg(dev, 0x01, [bank & 7, prog & 0x7F])),
    requestEditBuffer: dev => send(sysexMsg(dev, 0x03, [])),
    requestGlobals: dev => send(sysexMsg(dev, 0x05, [])),

    writeGlobal: (index, value, dev) => {
      if (!S.globalsPacked || index < 0 || index >= GLOBAL_BYTES) return false;
      const packed = S.globalsPacked.slice();
      setPackedByte(packed, index, value);
      return send([0xF0, 0x00, 0x20, 0x32, 0x20, dev & 0x0F, 0x06, 0x06]
        .concat(packed).concat([0xF7]));
    },

    patchToEditBuffer: (bank, prog, dev) => {
      const p = S.patches[bank + "-" + prog];
      if (!p) return false;
      return send([0xF0, 0x00, 0x20, 0x32, 0x20, dev & 0x0F, 0x04, 0x06]
        .concat(p).concat([0xF7]));
    },
    patchToSlot: (sb, sp, db, dp, dev) => {
      const p = S.patches[sb + "-" + sp];
      if (!p) return false;
      return send([0xF0, 0x00, 0x20, 0x32, 0x20, dev & 0x0F, 0x02, 0x06, db & 7, dp & 0x7F]
        .concat(p).concat([0xF7]));
    },

    // op de pc bewaart de browser zelf; de bibliotheek gaat mee via de back-up
    libSave: () => { S.info = "op de pc bewaart de browser dit zelf"; },

    // via de brug: het IP van de synth. Via Web MIDI: een deel van de poortnaam.
    setIp: t => {
      const v = (t || "").trim();
      if (mode === "bridge") {
        fetch("/config?ip=" + encodeURIComponent(v)).catch(() => {});
        return;
      }
      preferred = v.toLowerCase();
      pickPorts();
    },

    /** Zoekt de synth op het netwerk (alleen via de brug). */
    discover: () => {
      if (mode !== "bridge") {
        disco.status = "zoeken werkt via dm12-bridge.py; via Web MIDI kies je een poort";
        return;
      }
      disco.running = true;
      disco.status = "zoeken…";
      fetch("/discover?start=1").then(r => r.json()).then(d => Object.assign(disco, d))
        .catch(() => { disco.running = false; disco.status = "zoeken mislukt"; });
      const tick = () => fetch("/discover").then(r => r.json()).then(d => {
        Object.assign(disco, d);
        if (d.running) setTimeout(tick, 700);
      }).catch(() => { disco.running = false; });
      setTimeout(tick, 700);
    },
    discovered: () => JSON.stringify(disco),
    getWifiCreds: () => JSON.stringify({ssid: "", pw: ""}),
    connectWifi: () => { S.info = "op de pc loopt de verbinding via USB of rtpMIDI"; },
    disconnectWifi: () => { S.info = "op de pc loopt de verbinding via USB of rtpMIDI"; },

    copyToClipboard: clip,
    readClipboard: () => (navigator.clipboard && navigator.clipboard.readText)
      ? navigator.clipboard.readText().catch(() => "")
      : Promise.resolve(""),
  };

  init();
})();
</script>
<script>
"use strict";
window.onerror = m => { const e = document.getElementById("statusText"); if (e) e.textContent = "JS-fout: " + m; };

const BANKS = ["A","B","C","D","E","F","G","H"];
const PROGS = 128;
const CATS = ["NONE","BASS","PAD","LEAD","MONO","POLY","STAB","SFX","ARP","SEQ","PERC",
              "AMBIENT","MODULAR","USER-1","USER-2","USER-3","USER-4"];

const store = {
  load(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
  save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let names   = store.load("dm12.names", {});     // eigen namen
let favs    = new Set(store.load("dm12.favs", []));
let vals    = store.load("dm12.vals", {});      // laatst verstuurde parameterwaarden
let channel = store.load("dm12.channel", 0);
let curBank = store.load("dm12.bank", "A");
let current = store.load("dm12.current", null);
let tab     = "presets";
let libBank = 0;
let devNames = {};        // "A-0" -> [naam, categorie, heeftPatch]
let devId = 0;
let synthParams = null;   // parameterwaarden uit de synth (index = NRPN-nummer)
let lastParamRev = -1, lastNameCount = -1, lastGlobalRev = -1, wasConnected = false;
let dragging = false, readWaiting = 0, dragTimer = null;
let settingsOpened = false;
const started = Date.now();

// Tijdens slepen niet verversen, anders springt de regelaar onder je vinger weg.
// Met een tijdslot, want een gemiste touchend zou het volgen anders blokkeren.
function markDragging() {
  dragging = true;
  clearTimeout(dragTimer);
  dragTimer = setTimeout(() => { dragging = false; }, 800);
}

// Scan van namen of patches: strikt één verzoek per keer, en pas verder als het
// antwoord binnen is. Twee dumps die door elkaar heen aankomen laten de
// uitpakking uit de maat lopen, met onleesbare namen als gevolg.
let libState = null, scan = null;

function scanStart(kind, items, bank) {
  scan = {kind, items, bank, i:0, mark:-1, deadline:0};
  scanStep();
}

function scanStep() {
  if (!scan) return;
  if (scan.i >= scan.items.length) {
    statusText.textContent = "scan klaar (" + scan.items.length + " opgevraagd)";
    scan = null;
    AndroidBridge.libSave();
    return;
  }
  const it = scan.items[scan.i++];
  scan.mark = libState ? (scan.kind === "names" ? libState.nameDumps : libState.patchDumps) : 0;
  scan.deadline = Date.now() + (scan.kind === "names" ? 6000 : 2500);
  if (scan.kind === "names") AndroidBridge.requestBankNames(it, devId);
  else AndroidBridge.requestProgram(scan.bank, it, devId);
  setTimeout(poll, 600);
}

function scanTick(lib) {
  if (!scan) return;
  const n = scan.kind === "names" ? lib.nameDumps : lib.patchDumps;
  if (n > scan.mark || Date.now() > scan.deadline) scanStep();
}

// wachtrij voor losse SysEx-verzoeken.
// Moet boven poll() staan, want poll() leest queue.length.
let queue = [], queueTimer = null;
function enqueue(fn) {
  queue.push(fn);
  if (!queueTimer) queueTimer = setInterval(() => {
    const f = queue.shift();
    if (!f) { clearInterval(queueTimer); queueTimer = null; return; }
    f();
  }, 160);
}

// ================== parameterdefinities ==================
const S = (n, l, max) => ({k:"s", n, l, max: max || 255});
const B = (n, l) => ({k:"b", n, l, max:255});
const T = (n, l) => ({k:"t", n, l, max:1});
const E = (n, l, o) => ({k:"e", n, l, o, max:o.length - 1});
const H = l => ({k:"h", l});

               "Vast +2","Vast -2","Vast +5","Vast -5","Vast +12","Vast -12","Vast +24","Vast -24"];

               "Mono 3","Mono 4","Mono 6","Poly 6","Poly 8"];

const ETRIG = ["Mono","Re-trigger","Legato","One-shot"];
const AMODE = ["Op","Neer","Op & neer","Op inv","Neer inv","Op & neer inv","Op alt","Neer alt",
               "Willekeurig","Zoals gespeeld","Akkoord"];
const ACLK  = ["1/2","3/8","1/3","1/4","3/16","1/6","1/8","3/32","1/12","1/16","1/24","1/32","1/48"];
const FXT   = ["TC-DeepVRB","AmbVerb","RoomRev","VintageRev","HallRev","ChamberRev","PlateRev",
               "RichPltRev","GatedRev","Reverse","ChorusVerb","DelayVerb","FlangVerb","MidasEQ",
               "Enhancer","FairComp","MulBndDist","RackAmp","EdisonEX1","AutoPan","NoiseGate","Delay",
               "3TapDelay","4TapDelay","T-RayDelay","DecimDelay","ModDlyRev","Chorus","Chorus-D",
               "Flanger","Phaser","MoodFilter","DualPitch","RotarySpkr"];

const fxSlot = (nr, type, p1, gain) => [
  H("FX-slot " + nr), E(type, "FX " + nr + " type", FXT), S(gain, "FX " + nr + " gain", 150),

const PAGES = [

    H("Oscillator 2"),

    S(29,"Pitch-mod diepte"), E(32,"Pitch-mod bron",MODSEL),
    S(30,"Aftertouch → pitch"), S(31,"Modwheel → pitch"),
    H("Algemeen"),
    S(33,"Ruisniveau"), S(34,"Portamento-tijd"), E(35,"Portamento-modus",PORTA),
    S(36,"Pitchbend omhoog",24), S(37,"Pitchbend omlaag",24),
  ]},
  {id:"vcf", name:"Filter", params:[
    S(39,"Frequentie"), S(41,"Resonantie"), S(40,"Hoogdoorlaat (HPF)"),
    S(42,"Envelope-diepte"), E(50,"Envelope-polariteit",["Negatief","Positief"]),
    E(51,"Filterpolen",["4-polig","2-polig"]), T(52,"Bass boost"),
    S(49,"Toetsvolging"), S(43,"Envelope → velocity"),
    S(45,"LFO-diepte"), E(46,"LFO-keuze",["LFO 1","LFO 2"]),
    S(47,"Aftertouch → LFO"), S(48,"Modwheel → LFO"), S(44,"Pitchbend → frequentie"),
  ]},
  {id:"env", name:"Env", params:[
    H("VCA envelope"),
    S(53,"Attack"), S(54,"Decay"), S(55,"Sustain"), S(56,"Release"), E(57,"Trigger",TRIG),
    S(80,"VCA niveau"), S(81,"Envelope-diepte"), S(82,"Velocity"), B(83,"Pan spread"),
    H("VCF envelope"),
    S(62,"Attack"), S(63,"Decay"), S(64,"Sustain"), S(65,"Release"), E(66,"Trigger",TRIG),
    H("MOD envelope"),
    S(71,"Attack"), S(72,"Decay"), S(73,"Sustain"), S(74,"Release"), E(75,"Trigger",TRIG),
  ]},
  {id:"voice", name:"Stem", params:[
    E(85,"Stemmenmodus",POLY), E(84,"Stemprioriteit",PRIO), E(86,"Envelope-trigger",ETRIG),
    S(87,"Unison detune"), S(88,"Voice drift"), S(89,"Parameter drift"), S(90,"Drift rate"),
    B(91,"Portamento-balans"), T(92,"Key down reset"),
  ]},
  {id:"lfo", name:"LFO", params:[
    H("LFO 1"),
    S(0,"Snelheid"), S(1,"Delay / fade"), E(2,"Vorm",SHAPE), T(3,"Key sync"), T(4,"Arp sync"),
    S(5,"Poly / mono / spread"), S(6,"Slew rate"),
    H("LFO 2"),
    S(7,"Snelheid"), S(8,"Delay / fade"), E(9,"Vorm",SHAPE), T(10,"Key sync"), T(11,"Arp sync"),
    S(12,"Poly / mono / spread"), S(13,"Slew rate"),
  ]},
  {id:"arp", name:"Arp/Seq", params:[
    H("Arpeggiator"),
    T(155,"Aan"), E(156,"Modus",AMODE), S(157,"Tempo (20–275 bpm)"), E(158,"Klokdeler",ACLK),
    T(159,"Key sync"), S(160,"Gate-tijd"), T(161,"Hold"), S(162,"Patroon",64),
    S(163,"Swing (50–75%)",25), S(164,"Octaven (1–6)",5),
    H("Control sequencer"),
    T(117,"Aan"), S(119,"Lengte (1–32 stappen)",31), S(118,"Klokdeler",15),
    S(120,"Swing (50–75%)",25), E(121,"Key sync & loop",["Loop aan","Key sync aan","Beide aan"]),
    S(122,"Slew rate"),
  ]},
  {id:"fx", name:"FX", params:[
    E(222,"FX-modus",["Insert","Send","Bypass"]), S(165,"FX-routing",9),
    CT(113,"Analog thru"), CS(115,"3D-controller X"), CS(116,"3D-controller Y"), CS(117,"3D-controller Z"),
    ...fxSlot(1, 166, 167, 218),
    ...fxSlot(2, 179, 180, 219),
    ...fxSlot(3, 192, 193, 220),
    ...fxSlot(4, 205, 206, 221),
  ]},
  {id:"mod", name:"Mod", params:[
    ...[0,1,2,3,4,5,6,7].flatMap(i => [
      H("Mod " + (i + 1)),
      S(93 + i * 3, "Bron (0–22, zie handleiding)", 22),
      S(94 + i * 3, "Doel (0–129, zie handleiding)", 129),
      B(95 + i * 3, "Diepte"),
    ]),
  ]},
];

// ================== verbinding & status ==================
const led = document.getElementById("led");
const statusText = document.getElementById("statusText");
const ipInput = document.getElementById("ipInput");

// De interface mag nooit sneuvelen door een statusupdate.
function poll() {
  try { pollNow(); }
  catch (e) { statusText.textContent = "statusfout: " + e.message; }
}

function pollNow() {
  let s;
  try { s = JSON.parse(AndroidBridge.getStatus()); }
  catch { led.className = ""; statusText.textContent = "bridge-fout"; return; }

  led.className = s.connected ? "ok" : (s.wifiConnected ? "wifi" : "");
  let txt = s.connected ? "verbonden" : s.status;
  if (!s.connected && s.wifi) txt = s.wifi + " · " + txt;
  if (!s.connected && s.event) txt += " · " + s.event;
  if (document.activeElement !== ipInput) ipInput.value = s.ip;

  // meld je aan zodra de sessie er is: dan zet de synth NRPN + SysEx aan
  if (s.connected && !wasConnected) { AndroidBridge.appNotify(-1); }
  wasConnected = s.connected;

  // niet verbonden na een paar seconden? Dan de instellingen zelf openklappen,
  // want daar staan het IP-adres en de zoekknop.
  if (!s.connected && !settingsOpened && Date.now() - started > 7000) {
    settingsOpened = true;
    document.getElementById("settings").style.display = "block";
  }

  let lib;
  try { lib = JSON.parse(AndroidBridge.libStatus()); } catch { lib = null; }
  if (lib) {
    libState = lib;
    if (lib.dev >= 0) devId = lib.dev;
    document.getElementById("devInfo").textContent =
      "dev " + (lib.dev < 0 ? "?" : lib.dev) + (lib.iface >= 0 ? " · iface " + lib.iface : "");
    if (s.connected && lib.curBank >= 0 && lib.curProg >= 0) {
      txt += " · synth: " + BANKS[lib.curBank] + (lib.curProg + 1);
    }
    if (lib.info) txt += " · " + lib.info;
    document.getElementById("libStat").textContent =
      `namen: ${lib.names}/1024 · patches: ${lib.patches} · dumps: ${lib.nameDumps}/${lib.patchDumps}`
      + (lib.badNames ? ` · onleesbaar: ${lib.badNames}` : "")
      + ` · sysex: ${lib.sysex} (${lib.sysexLen} bytes, ${lib.segs} delen)`
      + (lib.framing ? ` · uitlijnfouten: ${lib.framing}` : "")
      + (scan ? ` · scan ${scan.i}/${scan.items.length}` : "")
      + (queue.length ? ` · wachtrij ${queue.length}` : "");
    if (lib.names !== lastNameCount) { lastNameCount = lib.names; loadDevNames(); }
    if (lib.paramRev !== lastParamRev) {
      lastParamRev = lib.paramRev;
      loadSynthParams();
      if (readWaiting) {
        txt = "waarden uit de synth ontvangen · " + txt;
        readWaiting = 0;
      }
    } else if (readWaiting && Date.now() - readWaiting > 4000) {
      txt = "geen antwoord van de synth op het uitleesverzoek · " + txt;
      readWaiting = 0;
    }
    scanTick(lib);
    if (isParamTab()) updateParamNote();
    if (lib.globalRev !== lastGlobalRev) { lastGlobalRev = lib.globalRev; loadGlobals(); }
    if (scan) txt = `scan ${scan.i}/${scan.items.length} · ` + txt;
  }
  statusText.textContent = txt;
}

function loadDevNames() {
  try { devNames = JSON.parse(AndroidBridge.libNames()) || {}; } catch { devNames = {}; }
  if (tab === "presets") renderGrid();
  if (tab === "lib") renderLib();
}

function loadSynthParams() {
  try {
    const p = JSON.parse(AndroidBridge.libParams());
    if (Array.isArray(p)) {
      synthParams = p;
      if (!dragging && isParamTab()) renderParams();
    }
  } catch {}
}

document.getElementById("gearBtn").addEventListener("click", () => {
  const s = document.getElementById("settings");
  s.style.display = s.style.display === "none" ? "block" : "none";
  settingsOpened = true;
});
document.getElementById("ipBtn").addEventListener("click", () => {
  AndroidBridge.setIp(ipInput.value.trim()); setTimeout(poll, 300);
});

// De synth opzoeken op het netwerk, zodat je geen IP hoeft te weten.
const findBtn = document.getElementById("findBtn");
findBtn.addEventListener("click", () => {
  AndroidBridge.discover();
  flash(findBtn, true);
  statusText.textContent = "zoeken op het netwerk…";
  pollDiscovery();
});

function pollDiscovery() {
  let d;
  try { d = JSON.parse(AndroidBridge.discovered()); } catch { return; }
  const row = document.getElementById("foundRow");
  row.innerHTML = "";
  const any = (d.found && d.found.length) || d.status;
  row.style.display = any ? "flex" : "none";
  if (d.status) {
    const s = document.createElement("span");
    s.style.cssText = "font-size:12px;color:var(--muted)";
    s.textContent = d.status;
    row.appendChild(s);
  }
  for (const f of d.found || []) {
    const b = document.createElement("button");
    b.className = "mini";
    b.textContent = f;
    b.addEventListener("click", () => {
      const ip = String(f).split(" ")[0];
      AndroidBridge.setIp(ip);
      ipInput.value = ip;
      statusText.textContent = "verbinden met " + ip + "…";
      row.style.display = "none";
    });
    row.appendChild(b);
  }
  if (d.running) setTimeout(pollDiscovery, 800);
}
const chSel = document.getElementById("midiCh");
for (let i = 0; i < 16; i++) {
  const o = document.createElement("option"); o.value = i; o.textContent = i + 1; chSel.appendChild(o);
}
chSel.value = channel;
chSel.addEventListener("change", () => { channel = +chSel.value; store.save("dm12.channel", channel); });

const ssidInput = document.getElementById("ssidInput");
const pwInput = document.getElementById("pwInput");
try {
  const c = JSON.parse(AndroidBridge.getWifiCreds());
  ssidInput.value = c.ssid; pwInput.value = c.pw;
} catch { ssidInput.value = "Deepmind12"; pwInput.value = "Passphrase"; }
document.getElementById("wifiBtn").addEventListener("click", () => {
  AndroidBridge.connectWifi(ssidInput.value.trim(), pwInput.value);
  statusText.textContent = "WiFi-verzoek gestart…";
});
document.getElementById("wifiOffBtn").addEventListener("click", () => AndroidBridge.disconnectWifi());
document.getElementById("notifyBtn").addEventListener("click", () => {
  AndroidBridge.appNotify(-1);
  statusText.textContent = "aanmelding verstuurd";
});
document.getElementById("panicBtn").addEventListener("click", () => AndroidBridge.panic(channel));

// ================== eigen dialoog ==================
// Een WebView negeert confirm() en alert(), dus die deden stilletjes niets.
function ask(msg) {
  return new Promise(res => {
    const m = document.getElementById("modal");
    document.getElementById("modalText").textContent = msg;
    document.getElementById("modalInput").style.display = "none";
    m.style.display = "flex";
    const done = v => { m.style.display = "none"; res(v); };
    document.getElementById("modalYes").onclick = () => done(true);
    document.getElementById("modalNo").onclick = () => done(false);
  });
}

/** Vraagt om tekst; geeft null terug bij annuleren. */
function askText(msg, initial) {
  return new Promise(res => {
    const m = document.getElementById("modal");
    const inp = document.getElementById("modalInput");
    document.getElementById("modalText").textContent = msg;
    inp.style.display = "block";
    inp.value = initial || "";
    m.style.display = "flex";
    inp.focus();
    const done = v => { m.style.display = "none"; inp.style.display = "none"; res(v); };
    document.getElementById("modalYes").onclick = () => done(inp.value);
    document.getElementById("modalNo").onclick = () => done(null);
  });
}

function tell(msg) {
  const m = document.getElementById("modal");
  document.getElementById("modalText").textContent = msg;
  document.getElementById("modalInput").style.display = "none";
  m.style.display = "flex";
  const close = () => { m.style.display = "none"; };
  document.getElementById("modalYes").onclick = close;
  document.getElementById("modalNo").onclick = close;
}

function buildTabs() {
  const t = document.getElementById("tabs");
  t.innerHTML = "";
  const all = [{id:"presets", name:"Presets"}, {id:"lib", name:"Bibliotheek"},
               ...PAGES, {id:"global", name:"Global"}];
  for (const p of all) {
    const b = document.createElement("button");
    b.className = "tab" + (tab === p.id ? " sel" : "");
    b.textContent = p.name;
    b.addEventListener("click", () => { tab = p.id; showTab(); });
    t.appendChild(b);
  }
}

function isParamTab() { return PAGES.some(p => p.id === tab); }

function showTab() {
  buildTabs();
  document.getElementById("page-presets").style.display = tab === "presets" ? "block" : "none";
  document.getElementById("page-lib").style.display = tab === "lib" ? "block" : "none";
  document.getElementById("page-global").style.display = tab === "global" ? "block" : "none";
  document.getElementById("page-params").style.display = isParamTab() ? "block" : "none";
  if (tab === "presets") renderGrid();

  else if (tab === "global") renderGlobals();

}

// ================== presets ==================
const grid = document.getElementById("grid");
const search = document.getElementById("search");

function progLabel(b, p) {
  const k = b + "-" + p;
  if (names[k]) return names[k];
  const d = devNames[k];
  if (d && d[0]) return d[0];
  return "Preset " + b + (p + 1);
}
function progCat(b, p) {
  const d = devNames[b + "-" + p];
  return d && d[1] > 0 ? CATS[d[1]] || "" : "";
}

function buildBankTabs(el, sel, onPick, withFav) {
  el.innerHTML = "";
  const list = withFav ? BANKS.concat(["FAV"]) : BANKS;
  for (const b of list) {
    const btn = document.createElement("button");
    const isFav = b === "FAV";
    btn.className = "bank-btn" + (isFav ? " fav" : "") + (sel === b ? " sel" : "");
    btn.textContent = isFav ? "★" : b;
    btn.addEventListener("click", () => onPick(b));
    el.appendChild(btn);
  }
}

function visibleProgs() {
  const q = search.value.trim().toLowerCase();
  const out = [];
  if (q) {
    for (const b of BANKS) for (let p = 0; p < PROGS; p++) {
      const lab = progLabel(b, p).toLowerCase();
      if (lab.includes(q) || (b + (p + 1)).toLowerCase() === q) out.push([b, p]);
    }
    return out;
  }
  if (curBank === "FAV") {
    for (const k of favs) { const [b, p] = k.split("-"); out.push([b, +p]); }
    out.sort((x, y) => x[0] === y[0] ? x[1] - y[1] : BANKS.indexOf(x[0]) - BANKS.indexOf(y[0]));
    return out;
  }
  for (let p = 0; p < PROGS; p++) out.push([curBank, p]);
  return out;
}

let pressTimer = null, longPressed = false;

function renderGrid() {
  buildBankTabs(document.getElementById("bankTabs"), curBank,
    b => { curBank = b; store.save("dm12.bank", b); search.value = ""; renderGrid(); }, true);
  grid.innerHTML = "";
  const progs = visibleProgs();
  if (!progs.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = curBank === "FAV" && !search.value
      ? "Nog geen favorieten — tik op de ★ van een preset." : "Geen presets gevonden.";
    grid.appendChild(d);
    return;
  }
  for (const [bank, prog] of progs) {
    const key = bank + "-" + prog;
    const div = document.createElement("div");
    div.className = "prog" + (current === key ? " current" : "");
    div.dataset.key = key;

    const num = document.createElement("div");
    num.className = "num";
    num.textContent = bank + String(prog + 1).padStart(3, "0");
    div.appendChild(num);

    const nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = progLabel(bank, prog);
    if (!names[key] && !(devNames[key] && devNames[key][0])) nm.style.color = "var(--muted)";
    div.appendChild(nm);

    const cat = progCat(bank, prog);
    if (cat) {
      const c = document.createElement("div");
      c.className = "cat"; c.textContent = cat; div.appendChild(c);
    }

    const star = document.createElement("span");
    star.className = "star" + (favs.has(key) ? " on" : "");
    star.textContent = "★";
    star.addEventListener("click", e => {
      e.stopPropagation();
      favs.has(key) ? favs.delete(key) : favs.add(key);
      store.save("dm12.favs", [...favs]);
      renderGrid();
    });
    div.appendChild(star);

    const start = () => {
      longPressed = false;
      pressTimer = setTimeout(() => { longPressed = true; rename(div, key, bank, prog); }, 550);
    };
    const stop = () => clearTimeout(pressTimer);
    div.addEventListener("touchstart", start, {passive:true});
    div.addEventListener("touchend", stop);
    div.addEventListener("touchmove", stop, {passive:true});
    div.addEventListener("mousedown", start);
    div.addEventListener("mouseup", stop);
    div.addEventListener("mouseleave", stop);
    div.addEventListener("click", () => { if (!longPressed) sendProgram(bank, prog); });
    div.addEventListener("contextmenu", e => e.preventDefault());
    grid.appendChild(div);
  }
}

function sendProgram(bank, prog) {
  const ok = AndroidBridge.send(BANKS.indexOf(bank), prog, channel);
  if (ok) {
    current = bank + "-" + prog;
    store.save("dm12.current", current);
    statusText.textContent = "verstuurd: " + bank + (prog + 1);
    for (const el of document.querySelectorAll(".prog")) {
      el.classList.toggle("current", el.dataset.key === current);
    }
    // parameters van het nieuwe programma ophalen
    setTimeout(() => AndroidBridge.requestEditBuffer(devId), 250);
  } else {
    statusText.textContent = "niet verbonden met de synth";
  }
}

function rename(div, key, bank, prog) {
  const el = div.querySelector(".name");
  const input = document.createElement("input");
  input.type = "text";
  input.value = names[key] || "";
  input.placeholder = progLabel(bank, prog);
  el.innerHTML = ""; el.appendChild(input);
  input.focus();
  const fin = save => {
    if (save) {
      const v = input.value.trim();
      v ? names[key] = v : delete names[key];
      store.save("dm12.names", names);
    }
    renderGrid();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") fin(true);
    if (e.key === "Escape") fin(false);
    e.stopPropagation();
  });
  input.addEventListener("blur", () => fin(true));
  input.addEventListener("click", e => e.stopPropagation());
}

search.addEventListener("input", renderGrid);
document.getElementById("backupBtn").addEventListener("click", () =>
  AndroidBridge.copyToClipboard(JSON.stringify({names, favs:[...favs], vals})));
document.getElementById("restoreBtn").addEventListener("click", async () => {
  try {
    // await: op Android komt er tekst terug, in de browser een belofte
    const d = JSON.parse(await AndroidBridge.readClipboard());
    if (d.names) names = d.names;
    if (Array.isArray(d.favs)) favs = new Set(d.favs);
    if (d.vals) vals = d.vals;
    store.save("dm12.names", names); store.save("dm12.favs", [...favs]); store.save("dm12.vals", vals);
    renderGrid();
    statusText.textContent = "back-up hersteld van het klembord";
  } catch { tell("Geen geldige back-up op het klembord gevonden."); }
});

// ================== parameters ==================
// Laat zien of de synth ook echt iets terugstuurt. Zonder dit is niet te zien
// of het aan de app ligt of aan een instelling op de synth.
function updateParamNote() {
  const el = document.getElementById("paramNote");
  if (!el) return;
  let t = synthParams ? "waarden uit de synth" : "nog niet uitgelezen";
  if (autoSync) t += " · auto aan";
  if (libState) {
    if (libState.rxPar > 0) t += " · synth stuurt mee: " + libState.rxLast;
    else if (libState.rxCC > 0) t += " · synth stuurt CC's: " + libState.rxLast;
    else t += " · synth stuurt niets (zet WiFi-modus op NRPN)";
  }
  el.textContent = t;
}

function pkey(p) { return p.n !== undefined ? "n" + p.n : "c" + p.cc; }
function pval(p) {
  if (p.n !== undefined && synthParams && p.n < synthParams.length && vals[pkey(p)] === undefined) {
    return synthParams[p.n];
  }
  const v = vals[pkey(p)];
  return v === undefined ? (p.k === "s" ? Math.round(p.max / 2) : 0) : v;
}
function fmt(p, v) {
  if (p.k === "e") return p.o[v] !== undefined ? p.o[v] : v;
  if (p.k === "t") return v ? "aan" : "uit";
  if (p.k === "b") return (v - 128 > 0 ? "+" : "") + (v - 128);
  return String(v);
}
function doSend(p, v) {
  vals[pkey(p)] = v;
  const ok = p.n !== undefined
    ? AndroidBridge.sendNRPN(p.n, v, channel)
    : AndroidBridge.sendCC(p.cc, v, channel);
  if (synthParams && p.n !== undefined && p.n < synthParams.length) synthParams[p.n] = v;
  return ok;
}
let saveTimer = null;
function sendParam(p, v) {
  doSend(p, v);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.save("dm12.vals", vals), 800);
}

function renderParams() {
  const page = PAGES.find(x => x.id === tab);
  const wrap = document.getElementById("paramList");
  updateParamNote();
  wrap.innerHTML = "";
  if (!page) return;
  for (const p of page.params) {
    if (p.k === "h") {
      const h = document.createElement("div");
      h.className = "phead"; h.textContent = p.l; wrap.appendChild(h);
      continue;
    }
    const v = pval(p);
    const box = document.createElement("div");
    box.className = "p";
    const lab = document.createElement("div");
    lab.className = "plab";
    const ls = document.createElement("span"); ls.textContent = p.l;
    const vs = document.createElement("span"); vs.className = "pval"; vs.textContent = fmt(p, v);
    lab.appendChild(ls); lab.appendChild(vs);
    box.appendChild(lab);

    if (p.k === "e") {
      const sel = document.createElement("select");
      p.o.forEach((o, i) => {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = o; sel.appendChild(opt);
      });
      sel.value = Math.min(v, p.max);
      sel.addEventListener("change", () => {
        const nv = +sel.value; vs.textContent = fmt(p, nv); sendParam(p, nv);
      });
      box.appendChild(sel);
    } else if (p.k === "t") {
      const btn = document.createElement("button");
      btn.className = "tog" + (v ? " on" : "");
      btn.textContent = v ? "aan" : "uit";
      btn.addEventListener("click", () => {
        const nv = btn.classList.contains("on") ? 0 : 1;
        btn.classList.toggle("on", !!nv);
        btn.textContent = nv ? "aan" : "uit";
        vs.textContent = fmt(p, nv);
        sendParam(p, nv);
      });
      box.appendChild(btn);
    } else {
      const r = document.createElement("input");
      r.type = "range"; r.min = 0; r.max = p.max; r.value = v;
      let t = null;
      r.addEventListener("input", () => {
        const nv = +r.value;
        vs.textContent = fmt(p, nv);
        markDragging();
        if (!t) t = setTimeout(() => { t = null; doSend(p, +r.value); }, 25);
      });
      const fin = () => {
        dragging = false;
        clearTimeout(dragTimer);
        clearTimeout(t); t = null;
        sendParam(p, +r.value);
      };
      r.addEventListener("change", fin);
      r.addEventListener("touchend", fin);
      box.appendChild(r);
    }
    wrap.appendChild(box);
  }
}

// ================== globale instellingen ==================
// De handleiding noemt de globale instellingen wel, maar niet op welke van de
// 45 bytes ze staan. Daarom leert de app dat door twee lezingen te vergelijken:
// verander iets op de synth, lees opnieuw, en de byte die veranderde licht op.
const GLOBAL_DOC = [
  "MIDI-kanaal", "keyboard local", "fader local", "global tune", "MIDI clock source",
  "program change (Rx/Tx/Both)", "USB control mode (CC/NRPN)", "MIDI control mode (CC/NRPN)",
  "MIDI soft thru", "USB → MIDI", "MIDI → USB", "fixed velocity", "velocity",
  "velocity curve", "transpose", "aftertouch curve", "pedal CC", "sustain CC",
  "fader pick-up", "LCD helderheid", "LCD contrast", "arp naar MIDI",
  "send NRPN on load", "keyboard octave"
];

// Alles wat je hier zelf invult -- namen, betekenis van de waardes en de
// indeling in menu's -- wordt op dit apparaat bewaard en is te exporteren.
let gmeta = store.load("dm12.gmeta", null);
if (!gmeta) {
  gmeta = {groups: [], bytes: {}};
  const old = store.load("dm12.gnames", {});   // eerdere versie: alleen namen
  for (const k in old) gmeta.bytes[k] = {name: old[k]};
}
let gData = null;

function saveMeta() { store.save("dm12.gmeta", gmeta); }
function bmeta(i) { return gmeta.bytes[i] || (gmeta.bytes[i] = {}); }
function groupExists(id) { return gmeta.groups.some(g => g.id === id); }
function groupOf(i) {
  const g = (gmeta.bytes[i] || {}).group;
  return g && groupExists(g) ? g : null;
}
function newGroupId() {
  let n = 1;
  while (groupExists("g" + n)) n++;
  return "g" + n;
}
function groupOptions() {
  const out = [];
  const walk = (parent, prefix) => {
    for (const g of gmeta.groups.filter(x => (x.parent || null) === parent)) {
      out.push([g.id, prefix + g.name]);
      walk(g.id, prefix + "· ");
    }
  };
  walk(null, "");
  return out;
}

async function addGroup(parent) {
  const s = await askText(parent ? "Naam van het nieuwe submenu" : "Naam van het nieuwe menu", "");
  if (s === null || !s.trim()) return;
  gmeta.groups.push({id: newGroupId(), name: s.trim(), parent: parent || undefined, open: true});
  saveMeta();
  renderGlobals();
}

async function renameByte(i) {
  const s = await askText("Naam van instelling #" + i, (gmeta.bytes[i] || {}).name || "");
  if (s === null) return;
  if (s.trim()) bmeta(i).name = s.trim(); else delete bmeta(i).name;
  saveMeta();
  renderGlobals();
}

/** Betekenis van de waardes, zoals de synth ze in zijn menu's toont. */
async function editLabels(i) {
  const m = bmeta(i);
  const cur = Object.keys(m.labels || {}).map(Number).sort((a, b) => a - b)
    .map(k => k + "=" + m.labels[k]).join(", ");
  const t = await askText("Waardes van #" + i + " een naam geven.\n\n"
    + "Schrijf als:  0=Rx, 1=Tx, 2=Both\nLeeg laten wist de labels.", cur);
  if (t === null) return;
  const labels = {};
  for (const part of t.split(",")) {
    const eq = part.indexOf("=");
    if (eq < 0) continue;
    const k = parseInt(part.slice(0, eq).trim(), 10);
    const v = part.slice(eq + 1).trim();
    if (!isNaN(k) && k >= 0 && k <= 255 && v) labels[k] = v;
  }
  if (Object.keys(labels).length) m.labels = labels; else delete m.labels;
  saveMeta();
  renderGlobals();
}

async function writeByte(i, nv, btn, oldVal) {
  if (isNaN(nv) || nv === oldVal) return;
  const m = gmeta.bytes[i] || {};
  const naam = m.name ? `“${m.name}” (#${i})` : `instelling #${i}`;
  const was = m.labels && m.labels[oldVal] ? `${m.labels[oldVal]} (${oldVal})` : oldVal;
  const wordt = m.labels && m.labels[nv] ? `${m.labels[nv]} (${nv})` : nv;
  const ok = await ask("Instelling van de synth wijzigen?\n\n" + naam + ": " + was + " → " + wordt
    + "\n\nWeet je niet zeker welke instelling dit is, lees dan eerst uit en vergelijk."
    + " Alle andere instellingen blijven ongewijzigd.");
  if (!ok) { renderGlobals(); return; }
  const done = AndroidBridge.writeGlobal(i, nv, devId);
  flash(btn, done);
  statusText.textContent = done ? naam + " naar " + wordt + " gestuurd"
                                : "niet verstuurd (geen verbinding of nog niet uitgelezen)";
  if (done) setTimeout(() => AndroidBridge.requestGlobals(devId), 400);
}

function groupHeader(g, depth) {
  const h = document.createElement("div");
  h.className = "ghead";
  h.style.marginLeft = (depth * 12) + "px";

  const tog = document.createElement("button");
  tog.className = "mini";

  tog.addEventListener("click", () => {
    g.open = (g.open === false);
    saveMeta();
    renderGlobals();
  });
  h.appendChild(tog);

  const t = document.createElement("span");
  t.className = "gtitle";
  t.textContent = g.name;
  t.addEventListener("click", async () => {
    const s = await askText("Naam van dit menu", g.name);
    if (s === null || !s.trim()) return;
    g.name = s.trim();
    saveMeta();
    renderGlobals();
  });
  h.appendChild(t);

  const sub = document.createElement("button");
  sub.className = "mini"; sub.textContent = "+";
  sub.title = "submenu toevoegen";
  sub.addEventListener("click", () => addGroup(g.id));
  h.appendChild(sub);

  const del = document.createElement("button");
  del.className = "mini"; del.textContent = "×";
  del.addEventListener("click", async () => {
    if (!await ask("Menu “" + g.name + "” verwijderen?\n\nDe instellingen erin blijven bestaan;"
        + " die komen weer onder ‘niet ingedeeld’ te staan.")) return;
    for (const c of gmeta.groups) if (c.parent === g.id) c.parent = g.parent || undefined;
    gmeta.groups = gmeta.groups.filter(x => x.id !== g.id);
    for (const k in gmeta.bytes) if (gmeta.bytes[k].group === g.id) delete gmeta.bytes[k].group;
    saveMeta();
    renderGlobals();
  });
  h.appendChild(del);
  return h;
}

function byteCard(i, depth, changed) {
  const m = gmeta.bytes[i] || {};
  const v = gData.bytes[i];
  const box = document.createElement("div");
  box.className = "p" + (changed.has(i) ? " changed" : "");
  box.style.marginLeft = (depth * 12) + "px";
  box.dataset.byte = i;

  const lab = document.createElement("div");
  lab.className = "plab";
  const ls = document.createElement("span");
  ls.textContent = "#" + String(i).padStart(2, "0") + " · "
    + (m.name || (changed.has(i) ? "net veranderd — geef een naam" : "onbekend"));
  if (!m.name) ls.style.color = "var(--muted)";
  ls.addEventListener("click", () => renameByte(i));
  const vs = document.createElement("span");
  vs.className = "pval";
  vs.textContent = m.labels && m.labels[v] ? m.labels[v] : String(v);
  lab.appendChild(ls);
  lab.appendChild(vs);
  box.appendChild(lab);

  const row = document.createElement("div");
  row.className = "row";

  if (m.labels && Object.keys(m.labels).length) {
    const sel = document.createElement("select");
    const vals = Object.keys(m.labels).map(Number);
    if (!vals.includes(v)) vals.push(v);
    vals.sort((a, b) => a - b).forEach(n => {
      const o = document.createElement("option");
      o.value = n;
      o.textContent = (m.labels[n] || "onbekend") + " (" + n + ")";
      sel.appendChild(o);
    });
    sel.value = v;
    sel.addEventListener("change", () => writeByte(i, +sel.value, sel, v));
    row.appendChild(sel);
  } else {
    const inp = document.createElement("input");
    inp.type = "number"; inp.min = 0; inp.max = 255; inp.value = v;
    const set = document.createElement("button");
    set.className = "mini"; set.textContent = "Zet";
    set.addEventListener("click", () =>
      writeByte(i, Math.max(0, Math.min(255, parseInt(inp.value, 10))), set, v));
    row.appendChild(inp);
    row.appendChild(set);
  }

  const lb = document.createElement("button");
  lb.className = "mini"; lb.textContent = "Labels";
  lb.title = "namen voor de waardes";
  lb.addEventListener("click", () => editLabels(i));
  row.appendChild(lb);

  const gsel = document.createElement("select");
  const none = document.createElement("option");
  none.value = ""; none.textContent = "— geen menu —";
  gsel.appendChild(none);
  for (const [id, label] of groupOptions()) {
    const o = document.createElement("option");
    o.value = id; o.textContent = label;
    gsel.appendChild(o);
  }
  gsel.value = groupOf(i) || "";
  gsel.addEventListener("change", () => {
    if (gsel.value) bmeta(i).group = gsel.value; else delete bmeta(i).group;
    saveMeta();
    renderGlobals();
  });
  row.appendChild(gsel);

  box.appendChild(row);
  return box;
}

function renderGlobals() {
  const list = document.getElementById("gList");
  const stat = document.getElementById("gStat");
  list.innerHTML = "";

  const changed = new Set(gData ? gData.changed || [] : []);
  stat.textContent = !gData
    ? "Nog niet uitgelezen — tik op ‘Lees uit synth’. Menu's aanmaken kan al wel."
    : `${gData.bytes.length} instellingen · lezing ${gData.rev}`
      + (gData.hadPrevious
          ? (changed.size ? ` · ${changed.size} veranderd sinds de vorige lezing`
                          : " · niets veranderd sinds de vorige lezing")
          : " · verander iets op de synth en lees opnieuw om ze te herkennen");

  const drawGroup = (g, depth) => {
    list.appendChild(groupHeader(g, depth));
    if (g.open === false) return;
    if (gData) {
      gData.bytes.forEach((_, i) => {
        if (groupOf(i) === g.id) list.appendChild(byteCard(i, depth + 1, changed));
      });
    }
    for (const c of gmeta.groups.filter(x => x.parent === g.id)) drawGroup(c, depth + 1);
  };
  for (const g of gmeta.groups.filter(x => !x.parent)) drawGroup(g, 0);

  if (!gData) return;
  const rest = gData.bytes.map((_, i) => i).filter(i => !groupOf(i));
  if (rest.length) {
    if (gmeta.groups.length) {
      const h = document.createElement("div");
      h.className = "ghead";
      h.textContent = "Niet ingedeeld";
      list.appendChild(h);
    }
    for (const i of rest) list.appendChild(byteCard(i, 0, changed));
  }
}

function loadGlobals() {
  try {
    const g = JSON.parse(AndroidBridge.globals());
    if (g && Array.isArray(g.bytes)) {
      gData = g;
      if (tab === "global") renderGlobals();
      return true;
    }
  } catch {}
  return false;
}

const gReadBtn = document.getElementById("gReadBtn");
gReadBtn.addEventListener("click", () => {
  const ok = AndroidBridge.requestGlobals(devId);
  flash(gReadBtn, ok);
  statusText.textContent = ok ? "globale instellingen opgevraagd…" : "niet verbonden";
});
document.getElementById("gNewMenu").addEventListener("click", () => addGroup(null));
document.getElementById("gExportBtn").addEventListener("click", () => {
  AndroidBridge.copyToClipboard(JSON.stringify(gmeta));
  statusText.textContent = "indeling naar klembord gekopieerd";
});
document.getElementById("gImportBtn").addEventListener("click", async () => {
  try {
    const d = JSON.parse(await AndroidBridge.readClipboard());
    if (!d || !Array.isArray(d.groups) || typeof d.bytes !== "object") throw new Error("vorm");
    if (!await ask("Indeling van het klembord overnemen?\n\n"
        + d.groups.length + " menu's en " + Object.keys(d.bytes).length + " benoemde instellingen."
        + "\n\nDit vervangt je huidige indeling.")) return;
    gmeta = d;
    saveMeta();
    renderGlobals();
    statusText.textContent = "indeling overgenomen";
  } catch { tell("Geen geldige indeling op het klembord gevonden."); }
});
document.getElementById("gHelpBtn").addEventListener("click", () => {
  tell("De synth stuurt zijn globale instellingen als één blok van 45 bytes. "
    + "De handleiding noemt wél welke instellingen erin zitten, maar niet op welke plek. "
    + "Daarom: lees uit, verander één ding op de synth (GLOBAL-menu), lees opnieuw — "
    + "de byte die veranderde licht oranje op. Geef hem een naam door erop te tikken, "
    + "en daarna kun je hem vanuit de app zetten.\n\n"
    + "Tik op ‘Labels’ om de waardes namen te geven (bijvoorbeeld 0=Rx, 1=Tx, 2=Both); "
    + "daarna kies je ze uit een lijst in plaats van een getal. Met ‘Nieuw menu’ maak je "
    + "eigen menu's en submenu's, net als op de synth, en met het keuzelijstje achter elke "
    + "instelling zet je hem in het juiste menu. Exporteer je indeling af en toe: het is "
    + "handwerk dat je niet nog eens wilt doen.\n\n"
    + "Instellingen volgens de handleiding: " + GLOBAL_DOC.join(", ") + ".\n\n"
    + "De WiFi-controlemodus (CC of NRPN) staat niet in de handleiding van 2016 en is "
    + "dus een van de overige bytes — precies iets om zo te vinden.");
});

document.getElementById("scanNames").addEventListener("click", () => {
  AndroidBridge.appNotify(devId);
  scanStart("names", [0,1,2,3,4,5,6,7]);
  statusText.textContent = "namen scannen, bank voor bank…";
});
document.getElementById("scanBankPatches").addEventListener("click", async () => {
  const bank = libBank;
  if (!await ask("Alle 128 patches van bank " + BANKS[bank] + " ophalen?\n\n"
      + "Dit duurt een paar minuten. Je kunt de app gewoon blijven gebruiken.")) return;
  scanStart("patches", Array.from({length: PROGS}, (_, i) => i), bank);
});
document.getElementById("libSaveBtn").addEventListener("click", () => {
  AndroidBridge.libSave();
  statusText.textContent = "bibliotheek opgeslagen op dit apparaat";
});
document.getElementById("libExportBtn").addEventListener("click", () => {
  AndroidBridge.copyToClipboard(AndroidBridge.libNames());
  statusText.textContent = "namen naar klembord gekopieerd";
});

// eerst de interface opbouwen, daarna pas verbinding en status
showTab();
poll();
setInterval(poll, 1500);
</script>
