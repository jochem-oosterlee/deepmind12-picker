document.getElementById("restoreBtn").addEventListener("click", async () => {
  try {
    // await: op Android komt er tekst terug, in de browser een belofte
    const d = JSON.parse(await AndroidBridge.readClipboard());
    if (d.names) names = d.names;
    if (Array.isArray(d.favs)) favs = new Set(d.favs);
    if (d.vals) vals = d.vals;
    store.save("dm12.names", names); store.save("dm12.favs", [...favs]); store.save("dm12.vals", vals);
    renderGrid();
    statusText.textContent = "backup restored from the clipboard";
  } catch { tell("No valid backup found on the clipboard."); }
});

// ================== parameters ==================
// Laat zien of de synth ook echt iets terugstuurt. Zonder dit is niet te zien
// of het aan de app ligt of aan een instelling op de synth.
function updateParamNote() {
  const el = document.getElementById("paramNote");
  if (!el) return;
  let t = synthParams ? "values from the synth" : "not read yet";
  if (autoSync) t += " · auto on";
  if (libState) {
    if (libState.rxPar > 0) t += " · synth is sending: " + libState.rxLast;
    else if (libState.rxCC > 0) t += " · synth is sending CCs: " + libState.rxLast;
    else t += " · synth sends nothing (set its WiFi mode to NRPN)";
  }
  el.textContent = t;
}

function pkey(p) { return p.n !== undefined ? "n" + p.n : "c" + p.cc; }
/**
 * Parameterwinkel: de enige plek die weet wat een parameter op dit moment is.
 *
 * Zonder dit had de app twee waarheden: wat de gebruiker het laatst stuurde en
 * wat de synth het laatst meldde, met de eerste die altijd voorging. Gevolg:
 * zodra je een regelaar aanraakte volgde die de synth niet meer.
 *
 * Nu komen beide richtingen hier binnen. Een lezing van de synth die ouder is
 * dan een wijziging van jou wordt genegeerd (anders springt een regelaar terug
 * naar de vorige waarde), en regelaars melden zich aan voor de parameters die
 * ze tonen, zodat alleen die bijgewerkt worden in plaats van de hele pagina.
 */
const params = {
  val: {},          // laatst bekende waarde per parameternummer
  pend: {},         // wat wij zelf net stuurden, met tijdstip
  subs: {},         // parameternummer -> functies die bijgewerkt willen worden
  ECHO_MS: 3000,

  get(n, fallback) {
    return this.val[n] === undefined ? fallback : this.val[n];
  },

  subscribe(n, fn) {
    (this.subs[n] = this.subs[n] || []).push(fn);
  },

  /** Bij het herbouwen van een pagina zijn de oude aanmeldingen niets meer. */
  clearSubs() { this.subs = {}; },

  /** Waarde zoals de synth hem meldt, uit een dump of een NRPN-bericht. */
  fromSynth(n, v) {
    const p = this.pend[n];
    if (p) {
      if (p.v === v) delete this.pend[n];                       // bevestigd
      else if (Date.now() - p.ms < this.ECHO_MS) return false;  // onze is nieuwer
    }
    if (this.val[n] === v) return false;
    this.val[n] = v;
    this.tell(n, v);
    return true;
  },

  /** Waarde die de gebruiker zet: meteen zichtbaar en meteen onderweg. */
  fromUi(n, v, ch) {
    const changed = this.val[n] !== v;
    this.val[n] = v;
    this.pend[n] = {v: v, ms: Date.now()};
    const ok = AndroidBridge.sendNRPN(n, v, ch);
    // Ook wat de gebruiker zelf zet gaat langs de abonnees: een knop kan een
    // lampje ernaast aansturen zonder dat hij dat lampje hoeft te kennen.
    // Eerst versturen, dan pas tekenen — het apparaat wacht nergens op.
    if (changed) this.tell(n, v);
    return ok;
  },

  tell(n, v) {
    for (const fn of this.subs[n] || []) {
      try { fn(v); } catch (e) { /* een regelaar die weg is */ }
    }
  },
};

// Welke parameternummers staan er op de pagina die nu in beeld is? Alleen
// daarvoor hoeft een onverwachte wijziging tot een herbouw te leiden.
let shownParams = new Set();

function pval(p) {
  const dflt = p.k === "s" ? Math.round(p.max / 2) : 0;
  if (p.n !== undefined) { shownParams.add(p.n); return params.get(p.n, dflt); }
  const v = vals[pkey(p)];          // parameters die alleen een CC hebben
  return v === undefined ? dflt : v;
}
function fmt(p, v) {
  if (p.k === "e") return p.o[v] !== undefined ? p.o[v] : v;
  if (p.k === "t") return v ? "on" : "off";
  if (p.k === "b") return (v - 128 > 0 ? "+" : "") + (v - 128);
  return String(v);
}
function doSend(p, v) {
  if (p.n !== undefined) return params.fromUi(p.n, v, channel);
  vals[pkey(p)] = v;                // alleen-CC parameters houden hun eigen plek
  return AndroidBridge.sendCC(p.cc, v, channel);
}
let saveTimer = null;
function sendParam(p, v) {
  doSend(p, v);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.save("dm12.vals", vals), 800);
}

// ================== LFO-paneel ==================
// Eén component voor beide LFO's: de parameters van LFO 2 staan zeven plekken
// verder (rate 0/7, delay 1/8, vorm 2/9, key sync 3/10, arp sync 4/11,
// poly-mono 5/12, slew 6/13).
const SHAPE_NAMES = ["Sine", "Triangle", "Square", "Ramp up", "Ramp down",
                     "Sample & Hold", "Sample & Glide"];

// Staat Arp sync aan, dan is de rate geen vrije waarde meer maar een
// notewaarde: twintig standen, van vier maten tot een vierenzestigste.
const SYNC_DIVS = ["4", "3", "2", "1", "1/2", "3/8", "1/3", "1/4", "3/16",
                   "1/6", "1/8", "3/32", "1/12", "1/16", "3/64", "1/24",
                   "1/32", "3/128", "1/48", "1/64"];
// De synth legt die twintig standen in één byte, verdeeld over het hele
// bereik: aan het apparaat zelf gemeten, met arp sync aan (parameter 4 = 1)
// stuurt de rate-knop gewoon 0 t/m 255 door, niet 0 t/m 19. Elke stand is dus
// een band van 256/20 breed. Nummert een latere firmware ze wel door, dan is
// dit de knop om om te zetten.
const SYNC_SPREAD = true;
const SYNC_BAND = 256 / SYNC_DIVS.length;

const syncSnap = {
  count: SYNC_DIVS.length,
  label: i => SYNC_DIVS[i],
  toIndex: v => Math.max(0, Math.min(SYNC_DIVS.length - 1,
    SYNC_SPREAD ? Math.floor(v / SYNC_BAND) : Math.round(v))),
  // midden in de band, dan valt een afronding aan de andere kant niet verkeerd
  toValue: i => {
    i = Math.max(0, Math.min(SYNC_DIVS.length - 1, i));
    return SYNC_SPREAD ? Math.round(i * SYNC_BAND + SYNC_BAND / 2) : i;
  },
};
const SHAPE_GLYPH = [
  'M1 8C5 1 9 1 13 8 17 15 21 15 25 8 27 4.5 29 3 31 3',
  'M1 14 8 2 15 14 22 2 29 14',
  'M1 14V2H8v12h7V2h7v12h7',
  'M1 14 12 3v11L23 3v11',
  'M1 3 12 14V3l11 11V3',
  'M1 10h7V4h7v9h7V7h7',
  'M1 10c4 0 3-6 7-6s3 9 7 9 3-6 7-6 4 0 7 0',
];

function lfoGlyph(shape, colour) {
  return '<svg width="32" height="16" viewBox="0 0 32 16" aria-hidden="true">'
    + '<path d="' + SHAPE_GLYPH[shape] + '" fill="none" stroke="' + colour
    + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/** Tekent de golfvorm zoals hij met deze instellingen zou lopen. */
function lfoWaveSvg(shape, rate, delay, slew, mono) {
  const w = 600, h = 120, mid = h / 2, amp = mid - 12;
  const n = 300;
  const cycles = 1 + Math.round((rate / 255) * 15);     // sneller = meer perioden
  // vaste reeks, zodat sample & hold niet bij elke tekening verspringt
  const rnd = [0.65, -0.35, 0.9, -0.8, 0.25, -0.6, 0.75, -0.15, 0.5, -0.95, 0.2, -0.7];
  const fade = Math.min(0.85, delay / 255);
  const k = shape === 6 ? 0.12 : 1 - Math.pow(slew / 255, 0.6) * 0.82;
  let prev = 0;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * cycles, ph = t % 1;
    let v;
    if (shape === 0) v = Math.sin(ph * Math.PI * 2);
    else if (shape === 1) v = 1 - 4 * Math.abs(ph - 0.5);
    else if (shape === 2) v = ph < 0.5 ? 1 : -1;
    else if (shape === 3) v = ph * 2 - 1;
    else if (shape === 4) v = 1 - ph * 2;
    else v = rnd[Math.floor(t) % rnd.length];
    prev += (v - prev) * k;
    const env = fade > 0.01 ? Math.min(1, (i / n) / fade) : 1;
    pts.push((i / n * w).toFixed(1) + "," + (mid - prev * amp * env).toFixed(1));
  }
  // kleuren uit het thema, zodat de tekening meegaat met de stijl
  const grid = [0.25, 0.5, 0.75].map(f =>
    '<line x1="' + (w * f) + '" y1="6" x2="' + (w * f) + '" y2="' + (h - 6)
    + '" stroke="var(--wave-grid)"/>').join("");
  const fadeMark = fade > 0.02
    ? '<rect x="0" y="0" width="' + (w * fade) + '" height="' + h
      + '" fill="var(--accent)" opacity="0.06"/>'
      + '<line x1="' + (w * fade) + '" y1="0" x2="' + (w * fade) + '" y2="' + h
      + '" stroke="var(--accent)" opacity="0.35" stroke-dasharray="3 3"/>' : "";
  return '<svg class="wave" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">'
    + grid + fadeMark
    + '<line x1="0" y1="' + mid + '" x2="' + w + '" y2="' + mid
    + '" stroke="var(--wave-axis)"/>'
    + '<polyline points="' + pts.join(" ") + '" fill="none" stroke="'
    + (mono > 0 ? "var(--active)" : "var(--accent)") + '" stroke-width="2"'
    + ' stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/**
 * Leest een filmstrip uit de skin: --naam-img, --naam-frames, --naam-w, --naam-h
 * en de gemeenschappelijke --sprite-scale. Zonder die variabelen valt de app
 * terug op de getekende regelaars, dus dit werkt alleen met een eigen skin.
 */
function skinStrip(name) {
  if (typeof getComputedStyle !== "function" || !document.body) return null;
  let cs;
  try { cs = getComputedStyle(document.body); } catch { return null; }
  if (!cs || !cs.getPropertyValue) return null;
  let img = (cs.getPropertyValue("--" + name + "-img") || "").trim();
  if (!img || img === "none") return null;
  // Een relatief pad in een CSS-variabele rekent de browser niet om naar de
  // map van het stijlbestand, dus dat doen we hier: skins staan in
  // local-assets, en daar staan de afbeeldingen ook.
  const m = img.match(/^url\(\s*['"]?([^'")]+)['"]?\s*\)$/);
  if (m) {
    const file = m[1];
    const abs = /^(https?:|data:|\/|local-assets\/)/.test(file);
    img = 'url("' + (abs ? file : "local-assets/" + file) + '")';
  }
  const num = k => parseFloat(cs.getPropertyValue("--" + name + "-" + k)) || 0;
  const w = num("w"), h = num("h"), frames = num("frames") || 1;
  if (!w || !h) return null;
  const scale = parseFloat(cs.getPropertyValue("--sprite-scale")) || 1;
  return {img: img, frames: frames, w: w, h: h, scale: scale};
}

/**
 * Regelaar die een frame uit de filmstrip toont. Slepen over 140 pixels loopt
 * het hele bereik af, met Shift voor fijnregeling; het scrollwiel stapt.
 */
function spriteControl(strip, value, max, onMove, onDone) {
  const el = document.createElement("div");
  el.className = "sprite";
  el.style.width = Math.round(strip.w * strip.scale) + "px";
  el.style.height = Math.round(strip.h * strip.scale) + "px";
  el.style.backgroundImage = strip.img;
  el.style.backgroundSize = "100% " + (strip.frames * 100) + "%";
  let val = value;
  const paint = () => {
    const f = strip.frames > 1
      ? Math.round((val / (max || 1)) * (strip.frames - 1)) : 0;
    el.style.backgroundPosition = "0 "
      + (strip.frames > 1 ? (f / (strip.frames - 1)) * 100 : 0) + "%";
  };
  paint();
  const set = (v, done) => {
    v = Math.max(0, Math.min(max, Math.round(v)));
    if (v === val && !done) return;
    val = v;
    paint();
    (done ? onDone : onMove)(val);
  };
  let from = null, startVal = 0;
  el.addEventListener("pointerdown", e => {
    from = e.clientY;
    startVal = val;
    markDragging();
    if (el.setPointerCapture && e.pointerId !== undefined) {
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  });
  el.addEventListener("pointermove", e => {
    if (from === null) return;
    markDragging();
    set(startVal + ((from - e.clientY) / 140) * max * (e.shiftKey ? 0.25 : 1));
  });
  const end = () => {
    if (from === null) return;
    from = null;
    dragging = false;
    set(val, true);
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("wheel", e => {
    if (e.preventDefault) e.preventDefault();
    set(val + (e.deltaY < 0 ? 1 : -1) * Math.max(1, Math.round(max / 64)), true);
  });
  return {el: el, setValue: v => { val = v; paint(); }};
}

/**
 * Lange fader: een gleuf van instelbare hoogte met een kapje dat eroverheen
 * schuift. Werkt met een kapje uit de skin en anders met een getekend kapje,
 * en is daardoor niet gebonden aan de hoogte van een filmstrip-frame.
 */
function longFader(label, value, max, height, onMove, onDone, disabled, opts) {
  const snap = opts && opts.snap, lo = (opts && opts.min) || 0, span = max - lo;
  const fmt = (opts && opts.fmt) || (v => v);
  const cap = skinStrip("fadercap");
  const capW = cap ? Math.round(cap.w * cap.scale) : 26;
  const capH = cap ? Math.round(cap.h * cap.scale) : 14;

  const box = document.createElement("div");
  box.className = "vf";
  box.style.width = Math.max(38, capW + 6) + "px";

  const num = document.createElement("div");
  num.className = "vnum";
  num.textContent = value;

  if (disabled) box.className += " off";
  const lane = document.createElement("div");
  lane.className = "lfader" + (disabled ? " off" : "");
  lane.style.height = height + "px";
  lane.style.width = Math.max(capW, 22) + "px";
  const slot = document.createElement("div");
  slot.className = "slot";
  const ticks = document.createElement("div");
  ticks.className = "ticks";
  const knobEl = document.createElement("div");
  knobEl.className = "cap";
  knobEl.style.width = capW + "px";
  knobEl.style.height = capH + "px";
  knobEl.style.marginLeft = (-capW / 2) + "px";
  if (cap) {
    knobEl.style.backgroundImage = cap.img;
  } else {
    knobEl.style.background =
      "linear-gradient(180deg,#5b5852,#26241f 62%,#3d3a35)";
    knobEl.style.borderRadius = "3px";
    knobEl.style.boxShadow = "0 1px 3px rgba(0,0,0,.45)";
  }
  lane.appendChild(slot);
  lane.appendChild(ticks);
  lane.appendChild(knobEl);

  const capName = document.createElement("div");
  capName.className = "vcap";
  capName.textContent = label;

  box.appendChild(capName); box.appendChild(lane); box.appendChild(num);

  let val = value;
  const travel = height - capH;
  const paint = () => {
    knobEl.style.top = Math.round((1 - (val - lo) / (span || 1)) * travel) + "px";
    num.textContent = snap ? snap.label(snap.toIndex(val)) : fmt(val);
  };
  paint();
  const set = (v, done) => {
    v = Math.max(lo, Math.min(max, Math.round(v)));
    // een fader met vaste standen klikt naar de dichtstbijzijnde
    if (snap) v = snap.toValue(snap.toIndex(v));
    if (v === val && !done) return;
    val = v;
    paint();
    (done ? onDone : onMove)(val);
  };

  let from = null, startVal = 0;
  const grab = e => {
    from = e.clientY;
    startVal = val;
    markDragging();
    if (lane.setPointerCapture && e.pointerId !== undefined) {
      try { lane.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  };
  lane.addEventListener("pointerdown", grab);
  lane.addEventListener("pointermove", e => {
    if (from === null) return;
    markDragging();
    set(startVal + ((from - e.clientY) / travel) * span * (e.shiftKey ? 0.25 : 1));
  });
  const end = () => {
    if (from === null) return;
    from = null;
    dragging = false;
    set(val, true);
  };
  lane.addEventListener("pointerup", end);
  lane.addEventListener("pointercancel", end);
  lane.addEventListener("wheel", e => {
    if (e.preventDefault) e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    if (snap) set(snap.toValue(snap.toIndex(val) + dir), true);
    else set(val + dir * Math.max(1, Math.round(span / 64)), true);
  });

  return {
    box: box, num: num,
    setValue: v => { val = v; paint(); },
    // van de synth: niet ingrijpen terwijl de gebruiker sleept
    fromSynth: v => { if (from === null) { val = v; paint(); } },
  };
}

/** Verticale fader met de waarde erboven en het label eronder. */
function vFader(label, value, max, onMove, onDone) {
  const box = document.createElement("div");
  box.className = "vf";
  const num = document.createElement("div");
  num.className = "vnum";
  num.textContent = value;
  const cap = document.createElement("div");
  cap.className = "vcap";
  cap.textContent = label;

  // biedt de skin een fader-filmstrip aan? Dan die gebruiken.
  const strip = skinStrip("fader");
  if (strip) {
    const sc = spriteControl(strip, value, max,
      v => { num.textContent = v; onMove(v); },
      v => { num.textContent = v; onDone(v); });
    const groove = document.createElement("div");
    groove.className = "sgroove";
    groove.style.width = sc.el.style.width;
    groove.style.height = sc.el.style.height;
    groove.appendChild(sc.el);
    box.appendChild(num); box.appendChild(groove); box.appendChild(cap);
    box.style.width = "auto";
    return {box: box, num: num, setValue: v => { num.textContent = v; sc.setValue(v); }};
  }

  const track = document.createElement("div");
  track.className = "vtrack";
  const r = document.createElement("input");
  r.type = "range"; r.min = 0; r.max = max; r.value = value;
  track.appendChild(r);
  box.appendChild(num); box.appendChild(track); box.appendChild(cap);

  let timer = null;
  r.addEventListener("input", () => {
    num.textContent = r.value;
    markDragging();
    if (!timer) timer = setTimeout(() => { timer = null; onMove(+r.value); }, 25);
  });
  const fin = () => {
    dragging = false;
    clearTimeout(timer); timer = null;
    onDone(+r.value);
  };
  r.addEventListener("change", fin);
  r.addEventListener("touchend", fin);
  return {box: box, num: num,
          setValue: v => { num.textContent = v; r.value = v; }};
}

// Eén byte met drie standen: 0 is poly, 1 is mono, en al het hogere is een
// faseverschil per stem — op het apparaat afgelezen in graden, 1° t/m 254°.
// De 256 waarden passen daar precies op, vandaar de verschuiving van één.
const PHASE_POLY = 0, PHASE_MONO = 1;
const PHASE_MIN = 1, PHASE_MAX = 254;          // in graden, zoals het menu
const degToRaw = d => d + 1;
const rawToDeg = r => r - 1;

/** Laatst gebruikte faseverschil per LFO (in graden), waar de knop weer begint. */
const lastPhaseByBase = {};
function lastPhase(base) {
  const d = lastPhaseByBase[base] || 64;
  return Math.max(PHASE_MIN, Math.min(PHASE_MAX, d));
}

function renderLfo(base, title) {
  const get = off => pval({k: "s", n: base + off, max: 255});

  // de golfvorm zoals hij met deze instellingen loopt
  const waveBox = document.createElement("div");
  waveBox.className = "wavebox";
  const draw = () => {
    waveBox.innerHTML = lfoWaveSvg(Math.min(6, get(2)), get(0), get(1), get(6), get(5));
  };

  const synced = get(4) > 0;
  const spreadOn = get(5) > PHASE_MONO;
  const H = 84;

  const arp = cell("ARP SYNC");
  arp.appendChild(swPill(base + 4));
  const key = cell("KEY SYNC");
  key.appendChild(swPill(base + 3));

  // Poly, mono of een faseverschil: dezelfde parameter, drie standen.
  const phase = cell("PHASE");
  phase.appendChild(statePill(base + 5, [
    {l: "Poly", v: PHASE_POLY},
    {l: "Mono", v: PHASE_MONO},
    {l: "Phase", v: () => degToRaw(lastPhase(base)), is: v => v > PHASE_MONO},
  ]));

  const box = panelBox(320, title,
    [pickBox(base + 2, SHAPE_NAMES, {cols: 4, icon: i => lfoGlyph(i, "var(--accent)")})],
    [panelFader(base + 0, "RATE", H, {after: draw, snap: synced ? syncSnap : null}),
     panelFader(base + 6, "SLEW", H, {after: draw}),
     panelFader(base + 5, "PHASE", H, {
       after: draw, disabled: !spreadOn, min: PHASE_MIN, max: PHASE_MAX,
       value: spreadOn ? get(5) : degToRaw(lastPhase(base)),
       toRaw: degToRaw, toShown: rawToDeg, fmt: v => v + "\u00B0",
     }),
     panelFader(base + 1, "DELAY", H, {after: draw})],
    [], {top: waveBox, side: [arp, key, phase]});
  box.className += " lfo";

  // Van soort veranderen vraagt een andere opmaak: de fase-fader wordt actief
  // of grijs, en met arp sync leest de rate notewaarden. Binnen een soort
  // hoeft er niets herbouwd te worden, ook niet terwijl je sleept.
  const kindOf = r => (r <= PHASE_MONO ? r : 2);
  let shownKind = kindOf(get(5));
  params.subscribe(base + 5, v => {
    if (kindOf(v) === shownKind) { draw(); return; }
    shownKind = kindOf(v);
    renderParams();
  });
  params.subscribe(base + 4, v => { if ((v > 0) !== synced) renderParams(); });
  params.subscribe(base + 2, draw);

  draw();
  return box;
}

// ================== filterpaneel ==================

/**
 * Schakelaar op een CC in plaats van een parameter.
 *
 * Analog thru gaat als control change over de lijn en komt niet terug van de
 * synth, dus deze hangt niet aan de waardenopslag.
 */
function ccSeg(cc, options) {
  const row = document.createElement("div");
  row.className = "seg";
  const p = {k: "t", cc: cc, max: 1};
  const spans = options.map(o => {
    const sp = document.createElement("span");
    sp.textContent = o.l;
    sp.addEventListener("click", () => { doSend(p, o.v); show(); });
    row.appendChild(sp);
    return sp;
  });
  const show = () => {
    const v = pval(p);
    spans.forEach((sp, i) => sp.classList.toggle("on", options[i].v === v));
  };
  show();
  return row;
}

// ================== versterker en high-pass ==================

function renderVca() {
  const H = 96;
  const boost = cell("BASS BOOST");
  boost.appendChild(swPill(52));

  // TRANSPARENT/RELAY staat in het ontwerp maar niet in de handleiding; het
  // enige wat erop lijkt is de analoge doorlus (CC 113).
  const thru = ccSeg(113, [{l: "TRANSPARENT", v: 1}, {l: "RELAY", v: 0}]);
  thru.style.width = "150px";

  return panelBox(380, "VCA / HPF", [thru],
    [panelFader(80, "LEVEL", H), panelFader(81, "ENV DEPTH", H),
     panelFader(82, "VEL > SENS", H), panelFader(83, "PAN SPREAD", H),
     panelFader(40, "HPF FREQ", H)],
    [], {side: [boost]});
}

function renderVcf() {
  const H = 96;

  // in de kop: twee of vier polen

  // De envelope kan de filterfrequentie ook omlaag halen; dat heet hier

  const small = [["VEL > ENV", 43], ["P.BEND > FREQ", 44],
                 ["AFT > LFO", 47], ["MW > LFO", 48]].map(([l, n]) => {

    small, {side: [lfoSel, inv, bass], cols: 4});

function lfoGlyphEl(shape) {
  const w = document.createElement("span");

// ================== oscillatorpanelen ==================
// Indeling en maten komen uit het ontwerp "OSC Layouts": twee of vier lange
// faders bovenin, een streep, en daaronder een raster met de kleine dingen.
// De bouwstenen hieronder gebruikt de rest van de app ook.

/** Golfvormtekening voor een knop in de paneelkop. */
function waveIcon(points) {
  return '<svg width="20" height="11" viewBox="0 0 26 14" aria-hidden="true">'
    + '<polyline points="' + points + '" fill="none" stroke="currentColor" '
    + 'stroke-width="2"/></svg>';
}
const ICON_SAW = "1,13 12,1 12,13 24,1 24,13";

/**
 * Blokgolf met de breedte die de synth nu heeft.
 *
 * De pulsbreedte is het enige aan een oscillator dat je nergens kunt aflezen:
 * PWM is een getal, maar het verschil tussen een blok en een dunne spriet hoor
 * je meteen. Vandaar dat de knop zijn eigen vorm laat zien.
 *
 * `swing` tekent er een tweede flank bij: staat de bron niet op Manual, dan
 * zet PWM niet de breedte maar hoe ver die heen en weer beweegt.
 */
function pulseIcon(duty, swing) {
  const top = 1, bot = 13, x0 = 1, per = 12;
  const line = (d, extra) => {
    const e1 = (x0 + per * d).toFixed(1), e2 = (x0 + per * (1 + d)).toFixed(1);
    return '<polyline points="' + x0 + "," + bot + " " + x0 + "," + top + " "
      + e1 + "," + top + " " + e1 + "," + bot + " "
      + (x0 + per) + "," + bot + " " + (x0 + per) + "," + top + " "
      + e2 + "," + top + " " + e2 + "," + bot + " " + (x0 + per * 2) + "," + bot
      + '" fill="none" stroke="currentColor" stroke-width="2"' + (extra || "") + "/>";
  };
  const clip = d => Math.max(0.08, Math.min(0.92, d));
  return '<svg width="20" height="11" viewBox="0 0 26 14" aria-hidden="true">'
    + (swing === undefined ? "" : line(clip(swing), ' stroke-opacity=".35"'))
    + line(clip(duty)) + "</svg>";
}

/** Van PWM-waarde naar breedte: 0 is een blok, hoog is een smalle puls. */
function pwmDuty(v) { return 0.5 - (v / 255) * 0.42; }

/** Knop in de kop van een paneel: een golfvorm of een woord. */
function headBtn(num, title, inner, watch) {
  const b = document.createElement("span");
  b.className = "hbtn";
  b.title = title;
  const show = () => {
    b.classList.toggle("on", params.get(num, 0) > 0);
    // een tekening die van andere parameters afhangt, tekent zichzelf opnieuw
    if (typeof inner === "function") b.innerHTML = inner();
  };
  if (typeof inner !== "function") b.innerHTML = inner;
  show();
  params.subscribe(num, show);
  (watch || []).forEach(n => params.subscribe(n, show));
  b.addEventListener("click", () => paramSet(num, params.get(num, 0) > 0 ? 0 : 1));
  return b;
}

/** Cel in het raster: label boven, regelaar eronder. */
function cell(label, wide) {
  const c = document.createElement("div");
  c.className = "cell" + (wide ? " wide" : "");
  const l = document.createElement("div");
  l.className = "lbl";
  l.textContent = label;
  c.appendChild(l);
  return c;
}

/** Handvol standen naast elkaar; de gekozen licht op. */
function segRow(num, options) {
  const row = document.createElement("div");
  row.className = "seg";
  // Een stand mag ook een bereik zijn: dan zegt `is` of je erin zit en levert
  // `v` de waarde waar je op uitkomt als je erop tikt.
  const valOf = o => (typeof o.v === "function" ? o.v() : o.v);
  const spans = options.map(o => {
    const sp = document.createElement("span");
    sp.textContent = o.l;
    sp.title = o.t || o.l;
    sp.addEventListener("click", () => paramSet(num, valOf(o)));
    row.appendChild(sp);
    return sp;
  });
  const show = () => {
    const v = params.get(num, valOf(options[0]));
    spans.forEach((sp, i) => {
      const o = options[i];
      sp.classList.toggle("on", o.is ? o.is(v) : valOf(o) === v);
    });
  };
  show();
  params.subscribe(num, show);
  return row;
}

/** Lange lijst: een vakje dat uitklapt. */
function pickBox(num, options, opts) {
  opts = opts || {};
  const box = document.createElement("div");
  box.className = "pick";
  const pop = document.createElement("div");
  pop.className = "shapepop";
  pop.style.display = "none";
  pop.style.gridTemplateColumns = "repeat(" + (opts.cols || 2) + ",1fr)";

  const lab = document.createElement("span");
  const show = () => {
    const cur = Math.min(options.length - 1, params.get(num, 0));
    lab.innerHTML = opts.icon ? opts.icon(cur) : "";
    lab.appendChild(document.createElement("span")).textContent =
      options[cur] + " ▾";
    Array.from(pop.children).forEach((b, i) => b.classList.toggle("on", i === cur));
  };
  let closer = null;
  const close = () => {
    pop.style.display = "none";
    popOpen = false;
    if (closer) { document.removeEventListener("click", closer); closer = null; }
  };
  options.forEach((nm, i) => {
    const b = document.createElement("button");
    if (opts.icon) {
      b.innerHTML = opts.icon(i);
      b.appendChild(document.createElement("span")).textContent = nm;
    } else {
      b.textContent = nm;
    }
    b.addEventListener("click", e => {
      if (e.stopPropagation) e.stopPropagation();
      paramSet(num, i);
      close();
    });
    pop.appendChild(b);
  });
  box.addEventListener("click", e => {
    if (e.stopPropagation) e.stopPropagation();
    if (pop.style.display !== "none") { close(); return; }
    pop.style.display = "grid";
    popOpen = true;
    closer = ev => { if (!box.contains || !box.contains(ev.target)) close(); };
    document.addEventListener("click", closer);
  });

  box.appendChild(lab);
  box.appendChild(pop);
  show();
  params.subscribe(num, show);
  return box;
}

/** Kleine draaiknop met de waarde eronder. */
function dial(num, max) {
  const wrap = document.createElement("div");
  const d = document.createElement("div");
  d.className = "dial";
  const needle = document.createElement("i");
  d.appendChild(needle);
  const num_ = document.createElement("div");
  num_.className = "num";
  wrap.appendChild(d);
  wrap.appendChild(num_);
  wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:3px";

  const top = max || 255;
  const paint = v => {
    // nul staat rechtop, en vandaar 270 graden met de klok mee
    needle.style.transform = "rotate(" + ((v / top) * 270) + "deg)";
    num_.textContent = v;
  };
  paint(params.get(num, 0));
  params.subscribe(num, paint);

  let from = null, startVal = 0;
  d.addEventListener("pointerdown", e => {
    from = e.clientY;
    startVal = params.get(num, 0);
    markDragging();
    if (d.setPointerCapture && e.pointerId !== undefined) {
      try { d.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  });
  d.addEventListener("pointermove", e => {
    if (from === null) return;
    markDragging();
    // honderd pixels is het hele bereik, met shift een kwart daarvan
    const v = startVal + ((from - e.clientY) / 100) * top * (e.shiftKey ? 0.25 : 1);
    paramSet(num, Math.max(0, Math.min(top, Math.round(v))), true);
  });
  const end = () => {
    if (from === null) return;
    from = null;
    dragging = false;
    paramSet(num, params.get(num, 0));
  };
  d.addEventListener("pointerup", end);
  d.addEventListener("pointercancel", end);
  return wrap;
}

/** Schuifschakelaar met meer dan twee standen: het knopje schuift mee. */
function statePill(num, states) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:3px";
  const pill = document.createElement("div");
  pill.className = "sw wide";
  const knob = document.createElement("i");
  knob.style.background = "var(--accent)";
  pill.appendChild(knob);
  const word = document.createElement("div");
  word.className = "word";
  wrap.appendChild(pill);
  wrap.appendChild(word);

  const valOf = st => (typeof st.v === "function" ? st.v() : st.v);
  const at = ["2px", "calc(50% - 5px)", "calc(100% - 12px)"];
  const which = () => {
    const v = params.get(num, 0);
    const i = states.findIndex(st => (st.is ? st.is(v) : valOf(st) === v));
    return i < 0 ? 0 : i;
  };
  const show = () => {
    const i = which();
    knob.style.left = at[Math.min(i, at.length - 1)];
    word.textContent = states[i].l;
  };
  show();
  params.subscribe(num, show);
  pill.addEventListener("click", () => {
    paramSet(num, valOf(states[(which() + 1) % states.length]));
  });
  return wrap;
}

/** Schuifschakelaar met het woord eronder. */
function swPill(num, offText, onText, opts) {
  opts = opts || {};
  // Meestal is 1 aan, maar niet altijd: bij een omgekeerde parameter (envelope
  // invert) staat "aan" juist voor 0.
  const onVal = opts.on === undefined ? 1 : opts.on;
  const offVal = opts.off === undefined ? 0 : opts.off;
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:3px";
  const sw = document.createElement("div");
  sw.className = "sw";
  sw.appendChild(document.createElement("i"));
  const txt = document.createElement("div");
  txt.className = "word";
  wrap.appendChild(sw);
  wrap.appendChild(txt);
  // zonder opgave geldt de gewone afspraak: alles boven nul staat aan
  const isOn = () => (opts.on === undefined
    ? params.get(num, 0) > 0
    : params.get(num, offVal) === onVal);
  const show = () => {
    sw.classList.toggle("on", isOn());
    txt.classList.toggle("on", isOn());
    txt.textContent = isOn() ? (onText || "On") : (offText || "Off");
  };
  show();
  params.subscribe(num, show);
  sw.addEventListener("click", () => paramSet(num, isOn() ? offVal : onVal));
  return wrap;
}

/** Waarde zetten en versturen; met `quiet` blijft het bewaren voor het einde. */
function paramSet(num, v, quiet) {
  const p = {k: "s", n: num, max: 255};
  if (quiet) doSend(p, v); else sendParam(p, v);
}

/** Lange fader zoals in het ontwerp: label boven, waarde onder.
 *
 * `opts.toRaw`/`opts.toShown` zijn er voor een regelaar die iets anders toont
 * dan er in de parameter staat, `opts.after` voor een tekening die mee moet.
 */
function panelFader(num, label, height, opts) {
  opts = opts || {};
  const max = opts.max === undefined ? 255 : opts.max;
  const p = {k: "s", n: num, max: 255};
  const raw = v => (opts.toRaw ? opts.toRaw(v) : v);
  const after = () => { if (opts.after) opts.after(); };
  const start = opts.value === undefined ? pval(p) : opts.value;
  const f = longFader(label, opts.toShown ? opts.toShown(start) : start, max, height,
    v => { doSend(p, raw(v)); after(); },
    v => { sendParam(p, raw(v)); after(); }, opts.disabled, opts);
  if (!opts.disabled) {
    params.subscribe(num, v => {
      f.fromSynth(opts.toShown ? opts.toShown(v) : v);
      after();
    });
  }
  return f.box;
}

/**
 * Paneelromp: kop met de naam en rechts wat erbij hoort, eventueel iets
 * daaronder (een tekening), een rij faders met eventueel een kolom ernaast,
 * en onder een streep een raster met de kleine regelaars.
 */
function panelBox(width, title, headRight, faders, cells, opts) {
  opts = opts || {};
  const box = document.createElement("div");
  box.className = "pnl";
  box.style.width = width + "px";

  const head = document.createElement("div");
  head.className = "head";
  const nm = document.createElement("span");
  nm.className = "name";
  nm.textContent = title;
  head.appendChild(nm);
  if (headRight && headRight.length === 1 && !headRight[0].classList.contains("hbtn")) {
    head.appendChild(headRight[0]);          // één vakje of balk vult de kop
  } else if (headRight && headRight.length) {
    const hb = document.createElement("span");
    hb.className = "hbtns";
    headRight.forEach(b => hb.appendChild(b));
    head.appendChild(hb);
  }
  box.appendChild(head);
  if (opts.top) box.appendChild(opts.top);

  const fads = document.createElement("div");
  fads.className = opts.side ? "pfads" : "fads";
  faders.forEach(f => fads.appendChild(f));
  if (opts.side) {
    const row = document.createElement("div");
    row.className = "prow";
    const side = document.createElement("div");
    side.className = "pside";
    opts.side.forEach(c => side.appendChild(c));
    row.appendChild(fads);
    row.appendChild(side);
    box.appendChild(row);
  } else {
    box.appendChild(fads);
  }

  if (cells && cells.length) {
    const rule = document.createElement("div");
    rule.className = "rule";
    box.appendChild(rule);
    const grid = document.createElement("div");
    grid.className = "cells" + (opts.cols === 4 ? " four" : "");
    cells.forEach(c => grid.appendChild(c));
    box.appendChild(grid);
  }
  return box;
}

     }, [25, 16])],

/**
 * Eén parameter als draaiknop, schakelaar of keuzelijst, voor een skin die
 * filmstrips aanbiedt. Compacter dan een kaart per parameter, en het is wat een
 * paneel ook doet: een knop met zijn naam eronder.
 */
function knobCell(p, knob, sw) {
  const v = pval(p);
  const cell = document.createElement("div");
  const fresh = p.n !== undefined && pRecent[p.n]
                && Date.now() - pRecent[p.n] < HILITE_MS;
  cell.className = "knobcell" + (fresh ? " changed" : "");

  const val = document.createElement("div");
  val.className = "kval";
  val.textContent = fmt(p, v);

  if (p.k === "t" && sw) {
    const c = spriteControl(sw, v, 1,
      nv => { val.textContent = fmt(p, nv); doSend(p, nv); },
      nv => { val.textContent = fmt(p, nv); sendParam(p, nv); });
    // een schakelaar met twee standen: tikken is genoeg
    c.el.addEventListener("click", () => {
      const nv = pval(p) > 0 ? 0 : 1;
      c.setValue(nv);
      val.textContent = fmt(p, nv);
      sendParam(p, nv);
    });
    cell.appendChild(c.el);
  } else if (p.k === "e") {
    const sel = document.createElement("select");
    p.o.forEach((o, i) => {
      const opt = document.createElement("option");
      opt.value = i; opt.textContent = o;
      sel.appendChild(opt);
    });
    sel.value = Math.min(v, p.max);
    sel.addEventListener("change", () => {
      const nv = +sel.value;
      val.textContent = fmt(p, nv);
      sendParam(p, nv);
    });
    cell.appendChild(sel);
  } else {
    const c = spriteControl(knob, v, p.max,
      nv => { val.textContent = fmt(p, nv); doSend(p, nv); },
      nv => { val.textContent = fmt(p, nv); sendParam(p, nv); });
    cell.appendChild(c.el);
    if (p.n !== undefined) {
      params.subscribe(p.n, nv => {
        c.setValue(nv);
        val.textContent = fmt(p, nv);
      });
    }
  }

  const nm = document.createElement("div");
  nm.className = "kname";
  nm.textContent = p.l;
  nm.title = p.l + (p.n !== undefined ? " (NRPN " + p.n + ")" : "");
  cell.appendChild(val);
  cell.appendChild(nm);
  return cell;
}

function renderParams() {
  const page = PAGES.find(x => x.id === tab);
  const wrap = document.getElementById("paramList");
  updateParamNote();
  params.clearSubs();
  shownParams = new Set();
  wrap.innerHTML = "";
  if (!page) return;
  if (page.custom === "lfo") {
    wrap.appendChild(renderLfo(0, "LFO 1"));
    wrap.appendChild(renderLfo(7, "LFO 2"));
    return;
  }

  // Een pagina kan bovenaan een paneel hebben; wat daarin staat hoeft er
  // daaronder niet nog eens als losse regelaar bij.
  let list = page.params;
  if (page.panel === "osc") {
    wrap.appendChild(renderOsc1());
    wrap.appendChild(renderOsc2());
    list = page.params.filter(p => !(OSC_PANEL.has(p.n)
      || p.l === "Oscillator 1" || p.l === "Oscillator 2"));
  }
  if (page.panel === "vcf") {
    wrap.appendChild(renderVcf());
    wrap.appendChild(renderVca());
    list = page.params.filter(p => !VCF_PANEL.has(p.n));
  }

  // Biedt de skin een knop-filmstrip aan? Dan een raster met draaiknoppen,
  // wat een stuk compacter is dan een kaart per parameter.
  const knob = skinStrip("knob");
  if (knob) {
    const sw = skinStrip("switch2");
    let grid = null;
    for (const p of list) {
      if (p.k === "h") {
        const h = document.createElement("div");
        h.className = "phead";
        h.textContent = p.l;
        wrap.appendChild(h);
        grid = null;
        continue;
      }
      if (!grid) {
        grid = document.createElement("div");
        grid.className = "knobgrid";
        wrap.appendChild(grid);
      }
      grid.appendChild(knobCell(p, knob, sw));
    }
    return;
  }

  for (const p of list) {
    if (p.k === "h") {
      const h = document.createElement("div");
      h.className = "phead"; h.textContent = p.l; wrap.appendChild(h);
      continue;
    }
    const v = pval(p);
    const box = document.createElement("div");
    const fresh = p.n !== undefined && pRecent[p.n]
                  && Date.now() - pRecent[p.n] < HILITE_MS;
    box.className = "p" + (fresh ? " changed" : "");
    const lab = document.createElement("div");
    lab.className = "plab";
    const ls = document.createElement("span"); ls.textContent = p.l;
    const vs = document.createElement("span"); vs.className = "pval"; vs.textContent = fmt(p, v);
    lab.appendChild(ls); lab.appendChild(vs);
    box.appendChild(lab);

    if (p.k === "e") {
      const sel = document.createElement("select");
      p.o.forEach((o, i) => {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = o; sel.appendChild(opt);
      });
      sel.value = Math.min(v, p.max);
      sel.addEventListener("change", () => {
        const nv = +sel.value; vs.textContent = fmt(p, nv); sendParam(p, nv);
      });
      box.appendChild(sel);
    } else if (p.k === "t") {
      const btn = document.createElement("button");
      btn.className = "tog" + (v ? " on" : "");
      btn.textContent = v ? "on" : "off";
      btn.addEventListener("click", () => {
        const nv = btn.classList.contains("on") ? 0 : 1;
        btn.classList.toggle("on", !!nv);
        btn.textContent = nv ? "on" : "off";
        vs.textContent = fmt(p, nv);
        sendParam(p, nv);
      });
      box.appendChild(btn);
    } else {
      const r = document.createElement("input");
      r.type = "range"; r.min = 0; r.max = p.max; r.value = v;
      let t = null;
      r.addEventListener("input", () => {
        const nv = +r.value;
        vs.textContent = fmt(p, nv);
        markDragging();
        if (!t) t = setTimeout(() => { t = null; doSend(p, +r.value); }, 25);
      });
      const fin = () => {
        dragging = false;
        clearTimeout(dragTimer);
        clearTimeout(t); t = null;
        sendParam(p, +r.value);
      };
      r.addEventListener("change", fin);
      r.addEventListener("touchend", fin);
      box.appendChild(r);
    }
    wrap.appendChild(box);
  }
}

// korte visuele bevestiging op de knop zelf
function flash(el, ok) {
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), ok ? 220 : 600);
}

                              : "not connected — nothing to request";

  const page = PAGES.find(x => x.id === tab);

});

// Auto: blijft de synth volgen door de edit buffer periodiek op te vragen.

}

    nm.className = "lname";
    nm.textContent = d && d[0] ? d[0] : "—";
    if (!d || !d[0]) nm.style.color = "var(--muted)";
    row.appendChild(nm);

    if (d && d[1] > 0) {
      const c = document.createElement("span");
      c.className = "lcat"; c.textContent = CATS[d[1]] || ""; row.appendChild(c);
    }

    const dot = document.createElement("span");
    dot.className = "dotp" + (d && d[2] ? " has" : "");
    dot.title = "patch stored"; row.appendChild(dot);

    const get = document.createElement("button");
    get.className = "mini"; get.textContent = "⤓";
    get.title = "fetch this patch from the synth";
    get.addEventListener("click", () => {
      enqueue(() => AndroidBridge.requestProgram(libBank, p, devId));
    });
    row.appendChild(get);

    const load = document.createElement("button");
    load.className = "mini"; load.textContent = "▶";
    load.title = "audition the stored patch (edit buffer)";
    load.addEventListener("click", () => {
      if (!AndroidBridge.patchToEditBuffer(libBank, p, devId)) {
        statusText.textContent = "no patch stored for " + key;
      } else {
        statusText.textContent = key + " to edit buffer";
      }
    });
    row.appendChild(load);

    const wr = document.createElement("button");
    wr.className = "mini"; wr.textContent = "⤴";
    wr.title = "write the stored patch back to this slot";
    wr.addEventListener("click", async () => {
      const ok = await ask("Write the stored patch back to " + key + "?\n\n"
        + "This overwrites the program currently in that slot of the synth.");
      if (!ok) return;
      const done = AndroidBridge.patchToSlot(libBank, p, libBank, p, devId);
      flash(wr, done);
      statusText.textContent = done ? key + " written back"
                                    : "no patch stored for " + key;
    });
    row.appendChild(wr);

    list.appendChild(row);
  }
}

// ================== globale instellingen ==================
// De handleiding noemt de globale instellingen wel, maar niet op welke van de
// 45 bytes ze staan. Daarom leert de app dat door twee lezingen te vergelijken:
// verander iets op de synth, lees opnieuw, en de byte die veranderde licht op.
const GLOBAL_DOC = [
  "MIDI-kanaal", "keyboard local", "fader local", "global tune", "MIDI clock source",
  "program change (Rx/Tx/Both)", "USB control mode (CC/NRPN)", "MIDI control mode (CC/NRPN)",
  "MIDI soft thru", "USB → MIDI", "MIDI → USB", "fixed velocity", "velocity",
  "velocity curve", "transpose", "aftertouch curve", "pedal CC", "sustain CC",
  "fader pick-up", "LCD brightness", "LCD contrast", "arp to MIDI",
  "send NRPN on load", "keyboard octave"
];

// Alles wat je hier zelf invult -- namen, betekenis van de waardes en de
// indeling in menu's -- wordt op dit apparaat bewaard en is te exporteren.
let gmeta = store.load("dm12.gmeta", null);
if (!gmeta) {
  gmeta = {groups: [], bytes: {}};
  const old = store.load("dm12.gnames", {});   // eerdere versie: alleen namen
  for (const k in old) gmeta.bytes[k] = {name: old[k]};
}
let gData = null;

const MAX_DEPTH = 2;          // drie niveaus: 0, 1 en 2
let gWatch = false;           // blijft de instellingen opnieuw uitlezen
let gWatchTimer = null;
let gOpen = {};               // welke kaartjes hun labels/menu open hebben staan
let gDrag = null;             // wat er versleept wordt
let gLastChanged = "";        // welke bytes het laatst veranderden
let gUndo = null;             // laatste wijziging, om terug te kunnen draaien
let gPending = null;          // verstuurde wijziging waarvan we het resultaat nalezen
let gSnapCheck = null;        // teruggezette momentopname die we nalezen
let gWriteIgnored = false;    // heeft deze synth een wijziging genegeerd?
let gRecent = {};             // wanneer een byte veranderde, voor de markering
let gJustSet = {};            // wanneer wij een byte zetten
let pRecent = {};             // idem voor parameters uit de editor
let gDraft = {};              // getypte labels die nog niet opgeslagen zijn
let gFocus = null;            // waar de cursor stond, om hem terug te zetten
let gFocusEl = null;
// Verwijzingen naar de gebouwde kaartjes. Tijdens het volgen werken we die
// bij in plaats van ze opnieuw te bouwen: anders raakt elk invoerveld en elke
// open keuzelijst zijn focus kwijt bij iedere lezing.
let gCards = {};
let gEditors = {};
let gBuilt = false, gBuiltLen = -1;
const HILITE_MS = 8000;

// Bij elke wijziging blijft de vorige versie bewaard, zodat handwerk niet
// verloren gaat door een ongelukkige actie.
function saveMeta() {
  try {
    const prev = localStorage.getItem("dm12.gmeta");
    if (prev && prev.length > 2) localStorage.setItem("dm12.gmeta.prev", prev);
  } catch {}
  store.save("dm12.gmeta", gmeta);
}
function bmeta(i) { return gmeta.bytes[i] || (gmeta.bytes[i] = {}); }
function groupExists(id) { return gmeta.groups.some(g => g.id === id); }
function groupById(id) { return gmeta.groups.find(g => g.id === id); }
function depthOf(id) {
  let d = 0, g = groupById(id);
  while (g && g.parent) { d++; g = groupById(g.parent); }
  return d;
}
function subtreeDepth(id) {
  const kids = gmeta.groups.filter(g => g.parent === id);
  return kids.length ? 1 + Math.max(...kids.map(k => subtreeDepth(k.id))) : 0;
}
function nextOrder(list) {
  return list.reduce((m, x) => Math.max(m, x.order || 0), 0) + 1;
}
function byteOrder(i) {
  const o = (gmeta.bytes[i] || {}).order;
  return o === undefined ? i : o;
}
function groupOf(i) {
  const g = (gmeta.bytes[i] || {}).group;
  return g && groupExists(g) ? g : null;
}
function newGroupId() {
  let n = 1;
  while (groupExists("g" + n)) n++;
  return "g" + n;
}
function groupOptions() {
  const out = [];
  const walk = (parent, prefix) => {
    for (const g of gmeta.groups.filter(x => (x.parent || null) === parent)) {
      out.push([g.id, prefix + g.name]);
      walk(g.id, prefix + "· ");
    }
  };
  walk(null, "");
  return out;
}

async function addGroup(parent) {
  const s = await askText(parent ? "Name of the new submenu" : "Name of the new menu", "");
  if (s === null || !s.trim()) return;
  gmeta.groups.push({id: newGroupId(), name: s.trim(), parent: parent || undefined,
                     open: true, order: nextOrder(gmeta.groups)});
  saveMeta();
  renderGlobals();
}

// ---------- slepen en neerzetten ----------

let gDropSide = "before";

/** Menukop als doel: alles wat erop valt komt in dat menu. */
function dropOnHeader(el, gid) {
  el.addEventListener("dragover", e => {
    if (e.preventDefault) e.preventDefault();
    el.classList.add("dropinto");
  });
  el.addEventListener("dragleave", () => el.classList.remove("dropinto"));
  el.addEventListener("drop", e => {
    if (e.preventDefault) e.preventDefault();
    el.classList.remove("dropinto");
    dropOnGroup(gid);
  });
}

/**
 * Kaartje als doel: een lijn links of rechts laat zien waar het gesleepte
 * terechtkomt, afhankelijk van welke helft je boven zit.
 */
function dropOnCard(el, i) {
  const clear = () => {
    el.classList.remove("dropbefore");
    el.classList.remove("dropafter");
  };
  el.addEventListener("dragover", e => {
    if (e.preventDefault) e.preventDefault();
    const r = el.getBoundingClientRect();
    const after = (e.clientX || 0) > r.left + r.width / 2;
    gDropSide = after ? "after" : "before";
    el.classList.toggle("dropafter", after);
    el.classList.toggle("dropbefore", !after);
  });
  el.addEventListener("dragleave", clear);
  el.addEventListener("drop", e => {
    if (e.preventDefault) e.preventDefault();
    clear();
    dropOnByte(i, gDropSide);
  });
}

function membersOf(gid) {
  if (!gData) return [];
  const out = [];
  gData.bytes.forEach((_, i) => { if ((groupOf(i) || null) === (gid || null)) out.push(i); });
  return out.sort((a, b) => byteOrder(a) - byteOrder(b));
}

function normalizeGroup(gid) {
  membersOf(gid).forEach((i, n) => { bmeta(i).order = n; });
}

function dropOnGroup(gid) {
  if (!gDrag) return;
  if (gDrag.kind === "byte") {
    const m = bmeta(gDrag.i);
    if (gid) m.group = gid; else delete m.group;
    m.order = 1e6;                       // achteraan in het nieuwe menu
    normalizeGroup(gid);
  } else if (gDrag.kind === "group" && gDrag.id !== gid) {
    const g = groupById(gDrag.id);
    if (!g) return;
    for (let p = gid; p; p = (groupById(p) || {}).parent) {
      if (p === g.id) return;            // niet in zijn eigen submenu laten vallen
    }
    if (gid && depthOf(gid) + 1 + subtreeDepth(g.id) > MAX_DEPTH) {
      statusText.textContent = "three levels deep is the maximum";
      gDrag = null;
      return;
    }
    g.parent = gid || undefined;
    g.order = nextOrder(gmeta.groups);
  }
  gDrag = null;
  saveMeta();
  renderGlobals();
}

/** Een instelling vlak voor of na een andere neerzetten, in datzelfde menu. */
function dropOnByte(target, side) {
  if (!gDrag || gDrag.kind !== "byte" || gDrag.i === target) { gDrag = null; return; }
  const m = bmeta(gDrag.i);
  const g = groupOf(target);
  if (g) m.group = g; else delete m.group;
  m.order = byteOrder(target) + (side === "after" ? 0.5 : -0.5);
  gDrag = null;
  normalizeGroup(g);
  saveMeta();
  renderGlobals();
}

async function renameByte(i) {
  const s = await askText("Name of setting #" + i, (gmeta.bytes[i] || {}).name || "");
  if (s === null) return;
  if (s.trim()) bmeta(i).name = s.trim(); else delete bmeta(i).name;
  saveMeta();
  renderGlobals();
}

/**
 * Labels voor de waardes: links de waarde, rechts de naam die de synth
 * ervoor toont, met een plusje om er meer bij te maken.
 */
/**
 * Bestaande labels als lijst waarin de plek de waarde is: 0, 1, 2, …
 * Ontbrekende waardes worden lege regels, zodat een eerder ingevoerde
 * toewijzing niet verschuift als je hem opnieuw opslaat.
 */
function labelList(i) {
  const m = gmeta.bytes[i] || {};
  const keys = Object.keys(m.labels || {}).map(Number);
  if (!keys.length) return [];
  const out = new Array(Math.max(...keys) + 1).fill("");
  keys.forEach(k => { out[k] = m.labels[k]; });
  return out;
}

function listToLabels(list) {
  const labels = {};
  list.forEach((t, n) => { if (t) labels[n] = t; });
  return labels;
}

/**
 * Hoe een waarde eruit hoort te zien. Een instelling is of een keuzelijst met
 * benoemde standen, of een bereik: dan is de waarde gewoon een getal, eventueel
 * met een verschuiving (byte 0 betekent bijvoorbeeld -48) en een eenheid.
 * Losse labels blijven werken, zodat 0 = "off" bij een bereik ook kan.
 */
function showValue(i, v) {
  const m = gmeta.bytes[i] || {};
  if (m.labels && m.labels[v]) return m.labels[v];
  if (m.type === "range") {
    const d = rawToShown(i, v);
    return (d > 0 && (m.from < 0 || m.signed) ? "+" : "") + d
           + (m.unit ? " " + m.unit : "");
  }
  return String(v);
}

function isRange(i) { return (gmeta.bytes[i] || {}).type === "range"; }

/**
 * Globale instellingen zijn te zetten via NRPN, en het nummer is gewoon
 * 300 + de bytepositie. Gemeten op een DeepMind 12 met de bytes 33, 36, 46 en
 * 51: alle vier namen de waarde over via NRPN, terwijl het terugschrijven van
 * het instellingenblok bij sommige juist geweigerd werd. Een afwijkend nummer
 * dat de app zag langskomen krijgt voorrang.
 */
const GLOBAL_NRPN_BASE = 300;
function globalNrpn(i) {
  const m = gmeta.bytes[i] || {};
  return m.nrpn !== undefined ? m.nrpn : GLOBAL_NRPN_BASE + i;
}

/** Bytewaarde naar het getal dat de synth toont. */
function rawToShown(i, v) {
  const m = gmeta.bytes[i] || {};
  if (m.type !== "range") return v;
  let raw = v;
  // negatieve waardes zitten meestal boven 127 (0 = 0, 255 = -1)
  if (m.signed && raw > 127) raw -= 256;
  return raw + (m.from || 0);
}

/** En terug: het ingetikte getal naar de byte die de synth wil. */
function shownToRaw(i, shown) {
  const m = gmeta.bytes[i] || {};
  let raw = shown - (m.from || 0);
  if (m.signed && raw < 0) raw += 256;
  return Math.max(0, Math.min(255, raw));
}

/** Alle labelsets die al ergens gebruikt worden, plus de bewaarde sets. */
function knownSets() {
  const out = [], seen = new Set();
  for (const s of gmeta.sets || []) {
    const key = s.labels.join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({name: s.name, labels: s.labels});
  }
  for (const k of Object.keys(gmeta.bytes)) {
    const list = labelList(+k);
    if (list.length < 2) continue;
    const key = list.join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    const nm = (gmeta.bytes[k] || {}).name || ("#" + k);
    out.push({name: nm + ": " + list.filter(Boolean).slice(0, 3).join("/"), labels: list});
  }
  return out;
}

function labelEditor(i) {
  const m = bmeta(i);
  const box = document.createElement("div");
  box.className = "extra";
  const cur = gData ? gData.bytes[i] : 0;

  // keuze tussen benoemde standen en een bereik. Bij een instelling die al hoge
  // waardes liet zien is een lijst zinloos, dus dan staat bereik voor.
  const modeRow = document.createElement("div");
  modeRow.className = "labrow";
  const mkMode = (label, range) => {
    const b = document.createElement("button");
    b.className = "mini" + ((m.type === "range") === range ? " on" : "");
    b.textContent = label;
    b.addEventListener("click", () => {
      if (range) {
        m.type = "range";
        if (m.from === undefined) m.from = 0;
      } else {
        delete m.type;
        delete m.from;
        delete m.unit;
      }
      saveMeta();
      renderGlobals();
    });
    return b;
  };
  modeRow.appendChild(mkMode("named steps", false));
  modeRow.appendChild(mkMode("number range", true));
  box.appendChild(modeRow);

  if (m.type === "range") {
    const r1 = document.createElement("div");
    r1.className = "labrow";
    const fromLab = document.createElement("span");
    fromLab.className = "labnum"; fromLab.textContent = "0 =";
    fromLab.title = "what the synth shows when this byte is 0";
    // gewoon tekst: een getalveld geeft halverwege een min-teken een lege
    // waarde terug, en dan zou de invoer terugspringen naar 0
    const from = document.createElement("input");
    from.type = "text"; from.className = "v"; from.inputMode = "numeric";
    from.value = m.from === undefined ? "0" : String(m.from);
    const unit = document.createElement("input");
    unit.type = "text"; unit.className = "l"; unit.placeholder = "unit (cents, semitones, %)";
    unit.value = m.unit || "";
    const hint = document.createElement("div");
    hint.style.cssText = "font-size:11px;color:var(--muted);padding:2px 0";
    const showHint = () => {
      hint.textContent = "Byte value " + cur + " now reads as " + showValue(i, cur)
        + ". Exceptions like 0 = off can still be named under ‘named steps’.";
    };
    showHint();

    // meteen bewaren tijdens het typen: dan kan de invoer niet meer verdwijnen
    let saveTimer = null;
    const apply = () => {
      const n = parseInt(from.value, 10);
      if (!isNaN(n)) m.from = n;
      const u = unit.value.trim();
      if (u) m.unit = u; else delete m.unit;
      showHint();
      updateGlobalsInPlace();          // kaartje bijwerken, editor onaangeroerd
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveMeta, 400);
    };
    from.addEventListener("input", apply);
    unit.addEventListener("input", apply);

    const signed = document.createElement("button");
    signed.className = "mini" + (m.signed ? " on" : "");
    signed.textContent = "±";
    signed.tabIndex = -1;   // Tab gaat van het getalveld naar de eenheid
    signed.title = "negative values sit above 127 (255 = -1). Try it and see which "
                 + "reading matches the synth.";
    signed.addEventListener("click", () => {
      if (m.signed) delete m.signed; else m.signed = true;
      signed.classList.toggle("on", !!m.signed);
      showHint();
      updateGlobalsInPlace();
      saveMeta();
    });

    const done = document.createElement("button");
    done.className = "mini"; done.textContent = "Close";
    done.addEventListener("click", () => {
      apply();
      saveMeta();
      gOpen[i] = null;
      renderGlobals();
    });
    r1.appendChild(fromLab); r1.appendChild(from); r1.appendChild(unit);
    r1.appendChild(signed); r1.appendChild(done);
    box.appendChild(r1);
    box.appendChild(hint);
    return box;
  }

  const rows = document.createElement("div");
  box.appendChild(rows);

  // Aantal standen: de hoogste waarde die de synth ooit liet zien betekent dat
  // er minstens zoveel standen zijn. Draai de instelling rond op de synth en de
  // regels verschijnen vanzelf.
  let draft = gDraft[i];
  if (!draft) {
    const ex = labelList(i);
    draft = new Array(Math.max(ex.length, 2)).fill("");
    ex.forEach((t, n) => { draft[n] = t; });
  }
  while (draft.length < Math.max((m.seen || 0) + 1, cur + 1)) draft.push("");
  gDraft[i] = draft;   // een verversing tijdens het volgen raakt niets kwijt

  const focusRow = n => {
    const r = rows.children[n];
    if (r && r.children[1] && r.children[1].focus) r.children[1].focus();
  };

  const makeRow = (t, n) => {
    const r = document.createElement("div");
    r.className = "labrow" + (n === cur ? " now" : "");
    const num = document.createElement("span");
    num.className = "labnum";
    num.textContent = n;
    if (n === cur) num.title = "the synth is on this setting now";
    const l = document.createElement("input");
    l.type = "text"; l.className = "l"; l.value = t || "";
    l.placeholder = n === cur ? "what does the synth show now?" : "name of this setting";
    l.addEventListener("input", () => {
      draft[n] = l.value;
      gFocus = {i: i, n: n, pos: l.selectionStart};
    });
    l.addEventListener("focus", () => { gFocus = {i: i, n: n, pos: l.selectionStart}; });
    l.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        if (n + 1 >= draft.length) draft.push("");
        rebuild();
        focusRow(n + 1);
      }
      e.stopPropagation();
    });
    const x = document.createElement("button");
    x.className = "mini"; x.textContent = "×"; x.title = "remove";
    // buiten de tab-volgorde, zodat Tab van tekstveld naar tekstveld gaat
    x.tabIndex = -1;
    x.addEventListener("click", () => { draft.splice(n, 1); rebuild(); });
    r.appendChild(num); r.appendChild(l); r.appendChild(x);
    if (gFocus && gFocus.i === i && gFocus.n === n) gFocusEl = l;
    return r;
  };

  const rebuild = () => {
    rows.innerHTML = "";
    draft.forEach((t, n) => rows.appendChild(makeRow(t, n)));
  };
  rebuild();

  // Meebewegen met de synth zonder de regels te herbouwen: nieuwe standen
  // worden toegevoegd en de regel waar de synth op staat licht op.
  gEditors[i] = () => {
    const at = gData ? gData.bytes[i] : 0;
    while (draft.length < at + 1) {
      draft.push("");
      rows.appendChild(makeRow("", draft.length - 1));
    }
    Array.from(rows.children).forEach((r, n) => {
      r.className = "labrow" + (n === at ? " now" : "");
      const inp = r.children[1];
      if (inp) {
        inp.placeholder = n === at ? "what does the synth show now?" : "name of this setting";
      }
    });
  };

  // uit de invoervelden zelf, niet uit de kladversie: wat je ziet is wat er staat
  const collect = () => Array.from(rows.children)
    .map(r => ((r.children[1] && r.children[1].value) || "").trim());

  const apply = list => {
    const labels = listToLabels(list);
    if (Object.keys(labels).length) m.labels = labels; else delete m.labels;
    saveMeta();
    delete gDraft[i];
    gFocus = null;
    gOpen[i] = null;
    renderGlobals();
  };

  // hergebruik: kies een set die elders al gebruikt wordt of bewaard is
  const sets = knownSets();
  if (sets.length) {
    const pick = document.createElement("select");
    const first = document.createElement("option");
    first.value = ""; first.textContent = "reuse a set…";
    pick.appendChild(first);
    sets.forEach((s, n) => {
      const o = document.createElement("option");
      o.value = n; o.textContent = s.name + "  (" + s.labels.length + ")";
      pick.appendChild(o);
    });
    pick.addEventListener("change", () => {
      const s = sets[+pick.value];
      if (!s) return;
      draft = s.labels.slice();
      while (draft.length < cur + 1) draft.push("");
      gDraft[i] = draft;
      rebuild();
    });
    const wrap = document.createElement("div");
    wrap.className = "labrow";
    wrap.appendChild(pick);
    box.appendChild(wrap);
  }

  const bar = document.createElement("div");
  bar.className = "labrow";
  const plus = document.createElement("button");
  plus.className = "mini"; plus.textContent = "+";
  plus.title = "add a row (or press Enter)";
  plus.addEventListener("click", () => { draft.push(""); rebuild(); focusRow(draft.length - 1); });
  const save = document.createElement("button");
  save.className = "mini"; save.textContent = "Save";
  save.addEventListener("click", () => apply(collect()));
  const keep = document.createElement("button");
  keep.className = "mini"; keep.textContent = "Save as set";
  keep.title = "name this list so you can reuse it later";
  keep.addEventListener("click", async () => {
    const list = collect().filter(Boolean);
    if (!list.length) return;
    const nm = await askText("Name for this set of values", list.slice(0, 3).join("/"));
    if (nm === null || !nm.trim()) return;
    gmeta.sets = gmeta.sets || [];
    gmeta.sets.push({name: nm.trim(), labels: list});
    apply(collect());
  });
  const close = document.createElement("button");
  close.className = "mini"; close.textContent = "Close";
  close.addEventListener("click", () => {
    delete gDraft[i];
    gFocus = null;
    gOpen[i] = null;
    renderGlobals();
  });
  bar.appendChild(plus); bar.appendChild(save); bar.appendChild(keep); bar.appendChild(close);
  box.appendChild(bar);
  return box;
}

/** Keuzelijst om de instelling in een menu te zetten (naast slepen). */
function menuPicker(i) {
  const box = document.createElement("div");
  box.className = "extra";
  const sel = document.createElement("select");
  const none = document.createElement("option");
  none.value = ""; none.textContent = "— no menu —";
  sel.appendChild(none);
  for (const [id, label] of groupOptions()) {
    const o = document.createElement("option");
    o.value = id; o.textContent = label;
    sel.appendChild(o);
  }
  sel.value = groupOf(i) || "";
  sel.addEventListener("change", () => {
    if (sel.value) bmeta(i).group = sel.value; else delete bmeta(i).group;
    normalizeGroup(sel.value);
    saveMeta();
    gOpen[i] = null;
    renderGlobals();
  });
  box.appendChild(sel);
  return box;
}

/** Zet een instelling direct, zonder tussenvraag. Terugdraaien kan met de knop. */
function writeByte(i, nv, btn, oldVal) {
  if (isNaN(nv) || nv === oldVal) return;
  const m = gmeta.bytes[i] || {};
  const naam = m.name ? `“${m.name}”` : `#${i}`;
  const wordt = m.labels && m.labels[nv] ? `${m.labels[nv]} (${nv})` : nv;
  // Altijd via NRPN: dat neemt de synth aan, ook bij instellingen die een
  // terugschrijving van het hele blok weigeren.
  const done = AndroidBridge.sendNRPN(globalNrpn(i), nv, channel);
  flash(btn, done);
  if (done) {
    gUndo = {i: i, old: oldVal, name: naam};
    gJustSet[i] = Date.now();
    // niet aannemen dat het gelukt is: nalezen of de synth het overnam
    gPending = {i: i, want: nv, ms: Date.now(), name: naam, shown: wordt};
    statusText.textContent = naam + " → " + wordt + ", checking…";
    setTimeout(() => AndroidBridge.requestGlobals(devId), 300);
  } else {
    statusText.textContent = "not sent (no connection, or not read yet)";
  }
  renderGlobals();
}

function undoWrite() {
  if (!gUndo) return;
  const u = gUndo;
  gUndo = null;
  const done = AndroidBridge.sendNRPN(globalNrpn(u.i), u.old, channel);
  statusText.textContent = done ? u.name + " back to " + u.old : "undo failed";
  if (done) setTimeout(() => AndroidBridge.requestGlobals(devId), 300);
  renderGlobals();
}

function groupHeader(g, depth) {
  const h = document.createElement("div");
  h.className = "ghead";
  h.style.marginLeft = (depth * 12) + "px";
  h.draggable = true;
  h.addEventListener("dragstart", () => { gDrag = {kind: "group", id: g.id}; });
  dropOnHeader(h, g.id);

  const tog = document.createElement("button");
  tog.className = "mini";
  tog.textContent = g.open === false ? "▸" : "▾";
  tog.addEventListener("click", () => {
    g.open = (g.open === false);
    saveMeta();
    renderGlobals();
  });
  h.appendChild(tog);

  const t = document.createElement("span");
  t.className = "gtitle";
  t.textContent = g.name;
  t.addEventListener("click", async () => {
    const s = await askText("Name of this menu", g.name);
    if (s === null || !s.trim()) return;
    g.name = s.trim();
    saveMeta();
    renderGlobals();
  });
  h.appendChild(t);

  if (depth < MAX_DEPTH) {
    const sub = document.createElement("button");
    sub.className = "mini"; sub.textContent = "+";
    sub.title = "add a submenu";
    sub.addEventListener("click", () => addGroup(g.id));
    h.appendChild(sub);
  }

  const del = document.createElement("button");
  del.className = "mini"; del.textContent = "×";
  del.addEventListener("click", async () => {
    if (!await ask("Delete the menu “" + g.name + "”?\n\nThe settings inside are kept;"
        + " they move back under ‘Unsorted’.")) return;
    for (const c of gmeta.groups) if (c.parent === g.id) c.parent = g.parent || undefined;
    gmeta.groups = gmeta.groups.filter(x => x.id !== g.id);
    for (const k in gmeta.bytes) if (gmeta.bytes[k].group === g.id) delete gmeta.bytes[k].group;
    saveMeta();
    renderGlobals();
  });
  h.appendChild(del);
  return h;
}

function isRecent(i) {
  const now = Date.now();
  return (gRecent[i] && now - gRecent[i] < HILITE_MS)
      || (gJustSet[i] && now - gJustSet[i] < HILITE_MS);
}

function byteCard(i) {
  const m = gmeta.bytes[i] || {};
  const v = gData.bytes[i];
  const mine = gJustSet[i] && Date.now() - gJustSet[i] < HILITE_MS;
  const card = document.createElement("div");
  card.className = "gcard" + (mine ? " justset" : (isRecent(i) ? " changed" : ""));
  card.dataset.byte = i;
  card.draggable = true;
  card.addEventListener("dragstart", () => { gDrag = {kind: "byte", i}; });
  dropOnCard(card, i);

  const top = document.createElement("div");
  top.className = "top";
  const idx = document.createElement("span");
  idx.className = "idx";
  // sterretje: deze synth nam eerder een wijziging van deze instelling niet over
  idx.textContent = "#" + String(i).padStart(2, "0") + (m.refused ? "*" : "");
  idx.title = m.refused
    ? "this synth refuses changes to this setting over MIDI — change it on the instrument"
    : "drag onto a menu, or between other settings";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = m.name || (isRecent(i) ? "just changed" : "unknown");
  if (!m.name) nm.style.color = "var(--muted)";
  nm.title = "click to name it";
  nm.addEventListener("click", () => renameByte(i));
  const val = document.createElement("span");
  val.className = "val";
  val.textContent = showValue(i, v);
  val.title = "raw byte value " + v;
  top.appendChild(idx); top.appendChild(nm); top.appendChild(val);
  card.appendChild(top);

  const ctl = document.createElement("div");
  ctl.className = "ctl";
  let ctlInput = null;

  if (m.labels && Object.keys(m.labels).length) {
    const sel = document.createElement("select");
    const vals = Object.keys(m.labels).map(Number);
    if (!vals.includes(v)) vals.push(v);
    vals.sort((a, b) => a - b).forEach(n => {
      const o = document.createElement("option");
      o.value = n;
      o.textContent = (m.labels[n] || "unnamed") + " · " + n;
      sel.appendChild(o);
    });
    sel.value = v;
    // de huidige waarde uit gData lezen: die kan inmiddels bijgewerkt zijn
    sel.addEventListener("change", () => writeByte(i, +sel.value, sel, gData.bytes[i]));
    ctl.appendChild(sel);
    ctlInput = sel;
  } else {
    // bij een bereik tikt de gebruiker het getal dat de synth toont
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = "numeric"; inp.value = rawToShown(i, v);
    if (m.unit) inp.title = m.unit;
    const set = document.createElement("button");
    set.className = "mini"; set.textContent = "Set";
    set.title = "send this value to the synth";
    set.addEventListener("click", () => {
      const typed = parseInt(inp.value, 10);
      if (isNaN(typed)) return;
      writeByte(i, shownToRaw(i, typed), set, gData.bytes[i]);
    });
    ctl.appendChild(inp);
    ctl.appendChild(set);
    ctlInput = inp;
  }

  const read = document.createElement("button");
  read.className = "mini"; read.textContent = "⟳";
  read.title = "read again from the synth";
  read.addEventListener("click", () => {
    const ok = AndroidBridge.requestGlobals(devId);
    flash(read, ok);
    statusText.textContent = ok ? "reading again…" : "not connected";
  });
  ctl.appendChild(read);

  const lb = document.createElement("button");
  lb.className = "mini"; lb.textContent = "abc";
  lb.title = "name the values";
  lb.addEventListener("click", () => {
    gOpen[i] = gOpen[i] === "labels" ? null : "labels";
    renderGlobals();
  });
  ctl.appendChild(lb);

  const mn = document.createElement("button");
  mn.className = "mini"; mn.textContent = "≡";
  mn.title = "put into a menu";
  mn.addEventListener("click", () => {
    gOpen[i] = gOpen[i] === "menu" ? null : "menu";
    renderGlobals();
  });
  ctl.appendChild(mn);

  card.appendChild(ctl);
  if (gOpen[i] === "labels") card.appendChild(labelEditor(i));
  if (gOpen[i] === "menu") card.appendChild(menuPicker(i));
  // onthouden welke elementen bij deze instelling horen, zodat het volgen
  // ze kan bijwerken zonder de kaart opnieuw te bouwen
  gCards[i] = {card: card, valEl: val, nmEl: nm, ctlEl: ctlInput,
               isSelect: !!(m.labels && Object.keys(m.labels).length)};
  return card;
}

/** Statusregel, markeringen en het onthouden van de hoogste waarde. */
function updateGStat() {
  const stat = document.getElementById("gStat");
  const changed = gData ? (gData.changed || []) : [];
  const now = Date.now();

  // De hoogste waarde die we ooit zagen zegt hoeveel standen een instelling
  // minstens heeft; daar groeit de labellijst op mee.
  if (gData) {
    let dirty = false;
    gData.bytes.forEach((v, i) => {
      if (v > ((gmeta.bytes[i] || {}).seen || 0)) { bmeta(i).seen = v; dirty = true; }
    });
    if (dirty) store.save("dm12.gmeta", gmeta);
  }
  for (const i of changed) {
    if (!gJustSet[i] || now - gJustSet[i] > 2000) gRecent[i] = now;   // niet onze eigen actie
  }

  // Leren welk NRPN-nummer bij een instelling hoort. Verzet je iets op de synth,
  // dan stuurt die eerst de parameter en verandert daarna de byte in het blok.
  // Bij precies één veranderde byte met dezelfde waarde is de koppeling zeker.
  if (changed.length === 1 && libState && libState.lpN >= 0
      && libState.lpV === gData.bytes[changed[0]]
      && now - libState.lpMs < 4000) {
    const i = changed[0];
    const m = bmeta(i);
    if (m.nrpn !== libState.lpN) {
      m.nrpn = libState.lpN;
      delete m.refused;                 // hiermee is hij alsnog te zetten
      saveMeta();
      statusText.textContent = "learned: setting #" + i + " is NRPN " + libState.lpN
        + " — the app can set it now";
    }
  }
  if (changed.length) {
    gLastChanged = changed.map(i => {
      const nm = (gmeta.bytes[i] || {}).name;
      return (nm ? nm : "#" + String(i).padStart(2, "0")) + " = " + gData.bytes[i];
    }).join(", ");
  }
  // Nalezen of een verstuurde wijziging echt is overgenomen. Sommige bytes
  // neemt de synth wel aan en andere niet, dus dat kun je alleen meten.
  if (gPending && gData && now - gPending.ms > 350) {
    const got = gData.bytes[gPending.i];
    const m = bmeta(gPending.i);
    if (got === gPending.want) {
      statusText.textContent = gPending.name + " is now " + gPending.shown;
      if (m.refused) { delete m.refused; saveMeta(); }
    } else {
      delete gJustSet[gPending.i];          // niet groen laten alsof het lukte
      gWriteIgnored = true;
      if (!m.refused) { m.refused = true; saveMeta(); }
      statusText.textContent = "the synth kept " + gPending.name + " at "
        + showValue(gPending.i, got) + " — it refuses changes to this one over MIDI";
    }
    gPending = null;
  }

  // idem voor een teruggezette momentopname: melden hoeveel er is overgenomen
  if (gSnapCheck && gData && now - gSnapCheck.ms > 400) {
    let same = 0, off = [];
    gSnapCheck.bytes.forEach((v, i) => {
      if (gData.bytes[i] === v) same++;
      else off.push("#" + i);
    });
    statusText.textContent = "snapshot “" + gSnapCheck.name + "”: " + same + " of "
      + gSnapCheck.bytes.length + " settings match"
      + (off.length ? " · refused: " + off.slice(0, 8).join(", ")
                    + (off.length > 8 ? " …" : "") : "");
    if (off.length) gWriteIgnored = true;
    gSnapCheck = null;
  }

  document.getElementById("gUndoBtn").style.display = gUndo ? "inline-block" : "none";
  // hoeveel er nog te benoemen zijn, en welke: dat is de vraag tijdens dit werk
  let left = "";
  if (gData) {
    const un = gData.bytes.map((_, i) => i).filter(i => !(gmeta.bytes[i] || {}).name);
    left = " · " + (gData.bytes.length - un.length) + "/" + gData.bytes.length + " named"
         + (un.length ? " · left: " + un.map(i => "#" + String(i).padStart(2, "0")).join(" ")
                      : " · all named");
  }
  stat.textContent = !gData
    ? "Not read yet — tap ‘Read from synth’. You can already create menus."
    : `${gData.bytes.length} settings` + left
      + (gWatch ? " · following the synth" : " · read " + gData.rev)
      + (gLastChanged ? " · last changed: " + gLastChanged : "")
      + (gWriteIgnored ? " · note: the synth accepts some settings and refuses"
                       + " others — a refused one is reported in the status line" : "");
}

/**
 * Werkt de bestaande kaartjes bij zonder ze te herbouwen. Zo blijven focus,
 * open keuzelijsten en half getypte tekst intact terwijl de app volgt.
 */
function updateGlobalsInPlace() {
  if (!gData) return;
  updateGStat();
  const now = Date.now();
  for (const key of Object.keys(gCards)) {
    const i = +key;
    const c = gCards[i];
    if (!c || !c.card) continue;
    const v = gData.bytes[i];
    const m = gmeta.bytes[i] || {};
    c.valEl.textContent = showValue(i, v);
    c.valEl.title = "raw byte value " + v;
    const mine = gJustSet[i] && now - gJustSet[i] < HILITE_MS;
    c.card.className = "gcard" + (mine ? " justset" : (isRecent(i) ? " changed" : ""));
    if (!m.name && c.nmEl) c.nmEl.textContent = isRecent(i) ? "just changed" : "unknown";
    // een regelaar niet bijwerken terwijl de gebruiker er in bezig is
    const shown = c.isSelect ? v : rawToShown(i, v);
    if (c.ctlEl && document.activeElement !== c.ctlEl
        && String(c.ctlEl.value) !== String(shown)) {
      c.ctlEl.value = shown;
    }
    if (gEditors[i]) gEditors[i]();   // open labeleditor bijwerken
  }
}

function renderGlobals() {
  const list = document.getElementById("gList");
  list.innerHTML = "";
  gFocusEl = null;
  gCards = {};
  gEditors = {};
  gBuilt = false;
  updateGStat();

  const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
  const grid = (members, depth) => {
    if (!members.length) return;
    const g = document.createElement("div");
    g.className = "ggrid";
    g.style.marginLeft = (depth * 12) + "px";
    members.forEach(i => g.appendChild(byteCard(i)));
    list.appendChild(g);
  };

  const drawGroup = (g, depth) => {
    list.appendChild(groupHeader(g, depth));
    if (g.open === false) return;
    grid(membersOf(g.id), depth + 1);
    gmeta.groups.filter(x => x.parent === g.id).sort(byOrder)
      .forEach(c => drawGroup(c, depth + 1));
  };
  gmeta.groups.filter(x => !x.parent).sort(byOrder).forEach(g => drawGroup(g, 0));

  if (!gData) return;
  const rest = membersOf(null);
  if (rest.length || gmeta.groups.length) {
    const h = document.createElement("div");
    h.className = "ghead";
    const t = document.createElement("span");
    t.className = "gtitle";
    t.textContent = rest.length ? "Unsorted" : "Unsorted (empty)";
    h.appendChild(t);
    dropOnHeader(h, null);   // hierheen slepen haalt iets weer uit een menu
    list.appendChild(h);
  }
  grid(rest, 0);

  // vanaf nu alleen bijwerken; herbouwen gebeurt pas bij een structuurwijziging
  gBuilt = Object.keys(gCards).length > 0;
  gBuiltLen = gData ? gData.bytes.length : -1;

  // cursor terugzetten waar hij stond, voor het geval er wel herbouwd is
  if (gFocusEl && gFocusEl.focus) {
    gFocusEl.focus();
    try {
      const p = gFocus && gFocus.pos != null ? gFocus.pos : gFocusEl.value.length;
      gFocusEl.setSelectionRange(p, p);
    } catch {}
  }
}

function loadGlobals() {
  try {
    const g = JSON.parse(AndroidBridge.globals());
    if (g && Array.isArray(g.bytes)) {
      gData = g;
      if (tab !== "global") return true;
      // Staan de kaartjes er al? Dan alleen bijwerken, niet herbouwen. Niet
      // tellen hoeveel kaartjes er zijn: bij een ingeklapt menu zijn dat er
      // minder, en dan zou elke lezing alles herbouwen — met verlies van focus.
      if (gBuilt && gBuiltLen === g.bytes.length) updateGlobalsInPlace();
      else renderGlobals();
      return true;
    }
  } catch {}
  return false;
}

const gWatchBtn = document.getElementById("gWatchBtn");

function setWatch(on) {
  gWatch = on;
  store.save("dm12.gwatch", on);
  gWatchBtn.classList.toggle("on", on);
  clearInterval(gWatchTimer);
  gWatchTimer = null;
  if (on) {
    AndroidBridge.requestGlobals(devId);
    gWatchTimer = setInterval(() => {
      if (tab === "global") AndroidBridge.requestGlobals(devId);
    }, 1200);
  }
}

});

// ---------- momentopnames van alle globale instellingen ----------
// Handig als back-up, en soms neemt de synth een enkele byte niet aan maar een
// compleet blok wel: dan zet je een eerder bewaarde stand in één keer terug.
let gSnaps = store.load("dm12.gsnaps", []);

function renderSnaps() {
  const sel = document.getElementById("gSnapList");
  const keep = sel.value;
  sel.innerHTML = "";
  if (!gSnaps.length) {
    const o = document.createElement("option");
    o.value = ""; o.textContent = "no snapshots yet";
    sel.appendChild(o);
    return;
  }
  gSnaps.forEach((s, n) => {
    const o = document.createElement("option");
    o.value = n; o.textContent = s.name + " (" + s.bytes.length + ")";
    sel.appendChild(o);
  });
  if (keep) sel.value = keep;
}

document.getElementById("gSnapBtn").addEventListener("click", async () => {
  if (!gData) { statusText.textContent = "read the settings first"; return; }
  const nm = await askText("Name for this snapshot of all "
    + gData.bytes.length + " settings", "");
  if (nm === null || !nm.trim()) return;
  gSnaps.push({name: nm.trim(), bytes: gData.bytes.slice()});
  store.save("dm12.gsnaps", gSnaps);
  renderSnaps();
  statusText.textContent = "snapshot “" + nm.trim() + "” saved on this device";
});

document.getElementById("gSnapRestore").addEventListener("click", async () => {
  const n = +document.getElementById("gSnapList").value;
  const s = gSnaps[n];
  if (!s) return;
  const diff = gData ? s.bytes.filter((v, i) => v !== gData.bytes[i]).length : 0;
  if (!await ask("Restore snapshot “" + s.name + "”?\n\n"
      + diff + " of " + s.bytes.length + " settings differ from what the synth has now."
      + "\n\nOnly those are sent. Note that this includes settings like the MIDI channel."))
    return;
  // per instelling via NRPN, en alleen wat afwijkt: dat neemt de synth aan
  let sent = 0, ok = true;
  s.bytes.forEach((v, i) => {
    if (!gData || gData.bytes[i] === v) return;
    if (AndroidBridge.sendNRPN(globalNrpn(i), v, channel) === false) ok = false;
    sent++;
  });
  statusText.textContent = ok
    ? "snapshot sent (" + sent + " settings), reading back…"
    : "not sent (no connection)";
  if (ok && sent) {
    gSnapCheck = {bytes: s.bytes, ms: Date.now(), name: s.name};
    setTimeout(() => AndroidBridge.requestGlobals(devId), 500);
  }
});

document.getElementById("gSnapDel").addEventListener("click", async () => {
  const n = +document.getElementById("gSnapList").value;
  const s = gSnaps[n];
  if (!s) return;
  if (!await ask("Delete snapshot “" + s.name + "”?")) return;
  gSnaps.splice(n, 1);
  store.save("dm12.gsnaps", gSnaps);
  renderSnaps();
});

  });
}
showTab();
poll();
// Kan de verbindingslaag zeggen wanneer er nieuws is, dan kijkt de pagina op
// dat moment en niet op een vast ritme. Even samenvoegen, want tijdens het
// draaien aan een knop komen er tientallen berichten per seconde binnen.
let pushTimer = null;
window.dm12Push = () => {
  if (pushTimer) return;
  pushTimer = setTimeout(() => { pushTimer = null; poll(); }, 16);
};

// En een eigen tik als vangnet: voor de verbindingsstatus, en voor een
// verbinding die niet kan duwen.
setInterval(poll, 250);
</script>
