<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepMind 12 — Controller</title>
<style>
  :root {
    --bg:#14161a; --panel:#1d2026; --panel2:#23272e; --border:#32363e;
    --text:#e8eaed; --muted:#8a919c; --accent:#4da3ff; --accent-dim:#2a5a8f;
    --active:#ffb547; --star:#ffd24d; --ok:#6fd487; --bad:#ff7b72; --radius:10px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
    padding:0 10px 24px; font-size:14px; }

  /* ---- kop ---- */
  #topbar { position:sticky; top:0; z-index:20; background:var(--bg); padding:8px 0 0;
    border-bottom:1px solid var(--border); }
  .row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  #led { width:14px; height:14px; border-radius:50%; background:var(--bad); flex:none;
    box-shadow:0 0 6px rgba(255,123,114,.6); }
  #led.wifi { background:var(--active); box-shadow:0 0 6px rgba(255,181,71,.6); }
  #led.ok { background:var(--ok); box-shadow:0 0 8px rgba(111,212,135,.7); }
  #statusText { flex:1; min-width:0; font-size:12px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  select, input[type="text"], button {
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius); padding:8px 10px; font-size:13px; outline:none; }
  select:focus, input:focus { border-color:var(--accent); }
  button { cursor:pointer; transition:background .08s, border-color .08s, transform .08s; }
  button:active { background:var(--accent-dim); border-color:var(--accent); color:#fff;
    transform:scale(.96); }
  /* knippert kort na een actie, zodat je ziet dat er iets verstuurd is */
  button.flash { background:var(--accent-dim); border-color:var(--accent); color:#fff; }
  button.mini { padding:6px 8px; font-size:12px; }
  #autoBtn.on, #gWatchBtn.on, #logBtn.on { background:#1e4d2b; border-color:var(--ok); color:#fff; }
  #settings input { flex:1; min-width:70px; }
  #tabs { display:flex; gap:5px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; padding:8px 12px; font-size:13px; white-space:nowrap; }
  .tab.sel { background:var(--accent-dim); border-color:var(--accent); color:#fff; }

  /* ---- presets ---- */
  .banks { display:flex; gap:5px; margin:10px 0; flex-wrap:wrap; }
  .bank-btn { flex:1; min-width:38px; padding:10px 0; text-align:center; font-weight:600; }
  .bank-btn.sel { background:var(--accent-dim); border-color:var(--accent); color:#fff; }
  .bank-btn.fav.sel { background:#5c4a15; border-color:var(--star); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:8px; }
  .prog { position:relative; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 10px 8px; cursor:pointer; user-select:none; min-height:60px; }
  .prog:active { background:var(--panel2); border-color:var(--accent); }
  .prog.current { border-color:var(--active); background:#2c2415; }
  .prog .num { font-size:11px; color:var(--muted); }
  .prog.current .num { color:var(--active); }
  .prog .name { margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prog .name input { width:100%; padding:3px; font-size:13px; border-radius:6px; }
  .prog .star { position:absolute; top:2px; right:2px; font-size:15px; padding:6px; color:var(--border); }
  .prog .star.on { color:var(--star); }
  .prog .cat { font-size:10px; color:var(--accent); text-transform:uppercase; }

  /* ---- parameters ---- */
  .phead { margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--accent);
    text-transform:uppercase; letter-spacing:.5px; }
  .p { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 10px; margin-bottom:6px; }
  .p .plab { display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:2px; }
  .p .pval { color:var(--accent); font-variant-numeric:tabular-nums; }
  .p input[type=range] { width:100%; height:26px; accent-color:var(--accent); background:transparent; }
  .p select { width:100%; margin-top:4px; }
  .p .tog { width:100%; margin-top:4px; }
  .p.changed { border-color:var(--active); background:#2c2415; }
  .p .tog.on { background:var(--accent-dim); border-color:var(--accent); color:#fff; }

  /* ---- bibliotheek ---- */
  .lrow { display:flex; align-items:center; gap:6px; background:var(--panel);
    border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px; margin-bottom:5px; }
  .lrow .lnum { font-size:11px; color:var(--muted); width:38px; flex:none; }
  .lrow .lname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .lcat { font-size:10px; color:var(--accent); text-transform:uppercase; flex:none; }
  .lrow .dotp { width:7px; height:7px; border-radius:50%; background:var(--border); flex:none; }
  .lrow .dotp.has { background:var(--ok); }
  .note { font-size:12px; color:var(--muted); line-height:1.6; margin:8px 0; }
  /* eigen dialoog: een WebView negeert confirm() en alert() */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  #modal .box { background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:16px; max-width:420px; width:100%; }
  #modalText { font-size:14px; line-height:1.5; margin-bottom:14px; white-space:pre-line; }
  .grow { flex:1; }
  .gchanged { border-color:var(--active); background:#2c2415; }
  .gname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ghead { display:flex; align-items:center; gap:6px; margin:10px 0 4px; font-size:12px;
    font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  .ghead .gtitle { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; cursor:grab; }
  .ghead input { text-transform:none; font-weight:400; flex:1; }
  .ghead button { padding:3px 7px; font-size:11px; }
  .ghead.drop { background:#1b2a3a; border-radius:6px; }

  /* compacte kaartjes, meerdere naast elkaar op een breed scherm */
  .ggrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:6px; }
  .gcard { background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:6px 8px; }
  .gcard.changed { border-color:var(--active); background:#2c2415; }
  .gcard.justset { border-color:var(--ok); background:#16281c; }
  /* lijn die laat zien waar het gesleepte terechtkomt */
  .gcard.dropbefore { box-shadow:inset 4px 0 0 0 var(--accent); }
  .gcard.dropafter { box-shadow:inset -4px 0 0 0 var(--accent); }
  .ghead.dropinto { background:#1b2a3a; border-radius:6px;
    box-shadow:inset 0 -3px 0 0 var(--accent); }
  .labnum { width:26px; color:var(--muted); font-size:11px; text-align:right;
    font-variant-numeric:tabular-nums; flex:none; align-self:center; }
  /* de stand waar de synth nu op staat */
  .labrow.now .labnum { color:var(--active); font-weight:600; }
  .labrow.now input.l { border-color:var(--active); }
  .gcard .top { display:flex; align-items:center; gap:6px; font-size:13px; }
  .gcard .idx { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums;
    cursor:grab; }
  .gcard .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gcard .val { color:var(--accent); font-variant-numeric:tabular-nums; }
  .gcard .ctl { display:flex; align-items:center; gap:4px; margin-top:4px; }
  .gcard .ctl > input[type=number] { width:58px; padding:4px 6px; }
  .gcard .ctl > select { flex:1; min-width:0; padding:4px 6px; font-size:12px; }
  .gcard button { padding:3px 6px; font-size:11px; }
  .gcard .extra { margin-top:6px; border-top:1px solid var(--border); padding-top:6px; }
  .labrow { display:flex; gap:4px; margin-bottom:4px; }
  .labrow input.v { width:58px; padding:4px 6px; }

  /* logboek */
  #logPanel { border:1px solid var(--border); border-radius:8px; background:#0f1115;
    padding:6px 8px; margin-bottom:8px; max-height:230px; overflow-y:auto; }
  .logline { display:flex; gap:6px; font-size:11px; line-height:1.55; cursor:pointer;
    font-family:ui-monospace,Consolas,"Courier New",monospace; }
  .logline:hover { background:#171a20; }
  .logline .t { color:#5f6672; flex:none; }
  .logline .d { flex:none; width:12px; text-align:center; color:var(--muted); }
  .logline.out .d { color:var(--accent); }
  .logline.in .d { color:var(--ok); }
  .logline .m { flex:1; min-width:0; word-break:break-word; color:var(--text); }
  .logline.change .m, .logline.write .m { color:var(--active); }
  .logline.odd .m { color:var(--bad); }
  .logline.param .m { color:var(--muted); }
  .loghex { font-size:10px; color:#6b7280; word-break:break-all; padding:1px 0 4px 20px;
    font-family:ui-monospace,Consolas,"Courier New",monospace; }
  .labrow input.l { flex:1; min-width:0; padding:4px 6px; }
  .gval { color:var(--accent); font-variant-numeric:tabular-nums; width:34px; text-align:right; }
  .lrow input[type=number] { width:64px; padding:6px; }
  .warn { color:var(--active); }
  .empty { color:var(--muted); padding:26px; text-align:center; }
  footer { margin-top:18px; font-size:11px; color:var(--muted); line-height:1.6; }
</style>
</head>
<body>

<div id="topbar">
  <div class="row">
    <span id="led" title="connection status"></span>
    <span id="statusText">connecting…</span>
    <button class="mini" id="logBtn" title="show what comes in and goes out">log</button>
    <button class="mini" id="gearBtn" title="settings">⚙</button>
  </div>
  <div id="logPanel" style="display:none">
    <div class="row" style="margin-bottom:4px">
      <span id="logInfo" style="font-size:11px;color:var(--muted);flex:1"></span>
      <button class="mini" id="logCopy">Copy</button>
      <button class="mini" id="logClear">Clear</button>
    </div>
    <div id="logList"></div>
  </div>
  <div id="settings" style="display:none">
    <div class="row">
      <input type="text" id="ipInput" placeholder="synth IP address">
      <button class="mini" id="ipBtn">Connect</button>
      <button class="mini" id="findBtn">Find</button>
      <label style="font-size:12px;color:var(--muted)">Ch.</label>
      <select id="midiCh"></select>
    </div>
    <div class="row" id="foundRow" style="display:none;flex-wrap:wrap"></div>
    <div class="row">
      <input type="text" id="ssidInput" placeholder="SSID">
      <input type="text" id="pwInput" placeholder="password">
      <button class="mini" id="wifiBtn">WiFi</button>
      <button class="mini" id="wifiOffBtn">Los</button>
    </div>
    <div class="row">
      <button class="mini" id="notifyBtn">Announce to synth</button>
      <button class="mini" id="panicBtn">Panic</button>
      <span id="devInfo" style="font-size:11px;color:var(--muted)"></span>
    </div>
  </div>
  <div id="tabs"></div>
</div>

<div id="page-presets">
  <div class="row"><input type="text" id="search" placeholder="Search presets…" style="flex:1">
    <button class="mini" id="backupBtn">Back up</button>
    <button class="mini" id="restoreBtn">Restore</button></div>
  <div class="banks" id="bankTabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="modal" style="display:none">
  <div class="box">
    <div id="modalText"></div>
    <input type="text" id="modalInput" style="display:none;width:100%;margin-bottom:12px">
    <div class="row" style="justify-content:flex-end;margin:0">
      <button id="modalNo">Cancel</button>
      <button id="modalYes">Continue</button>
    </div>
  </div>
</div>

<div id="page-global" style="display:none">
  <div class="row" style="flex-wrap:wrap">
    <button class="mini" id="gReadBtn">Read from synth</button>
    <button class="mini" id="gWatchBtn" title="keep reading and show what changes">Follow</button>
    <button class="mini" id="gUndoBtn" style="display:none">↶ Undo</button>
    <button class="mini" id="gNewMenu">New menu</button>
    <button class="mini" id="gExportBtn">Export layout</button>
    <button class="mini" id="gImportBtn">Import</button>
    <button class="mini" id="gHelpBtn">Help</button>
  </div>
  <div class="note" id="gStat">Not read yet.</div>
  <div id="gList"></div>
</div>

<div id="page-lib" style="display:none">
  <div class="row" style="flex-wrap:wrap">
    <button class="mini" id="scanNames">Scan all names</button>
    <button class="mini" id="scanBankPatches">Fetch bank patches</button>
    <button class="mini" id="libSaveBtn">Save</button>
    <button class="mini" id="libExportBtn">Export</button>
  </div>
  <div class="note" id="libStat">—</div>
  <div class="banks" id="libBanks"></div>
  <div id="libList"></div>
</div>

<div id="page-params" style="display:none">
  <div class="row">
    <button class="mini" id="readBtn">Read synth</button>
    <button class="mini" id="pushBtn">Send page</button>
    <button class="mini" id="autoBtn" title="keep following the synth">Auto</button>
    <span id="paramNote" style="font-size:11px;color:var(--muted);flex:1"></span>
  </div>
  <div id="paramList"></div>
</div>

<footer id="foot">v1.11 · On the synth, set <i>GLOBAL → MIDI SETTINGS → PROGRAM CHANGE</i> to <i>Rx</i>/<i>Both</i>.</footer>

<script>
"use strict";
window.onerror = m => { const e = document.getElementById("statusText"); if (e) e.textContent = "script error: " + m; };

const BANKS = ["A","B","C","D","E","F","G","H"];
const PROGS = 128;
const CATS = ["NONE","BASS","PAD","LEAD","MONO","POLY","STAB","SFX","ARP","SEQ","PERC",
              "AMBIENT","MODULAR","USER-1","USER-2","USER-3","USER-4"];

const store = {
  load(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
  save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let names   = store.load("dm12.names", {});     // eigen namen
let favs    = new Set(store.load("dm12.favs", []));
let vals    = store.load("dm12.vals", {});      // laatst verstuurde parameterwaarden
let channel = store.load("dm12.channel", 0);
let curBank = store.load("dm12.bank", "A");
let current = store.load("dm12.current", null);
let tab     = "presets";
let libBank = 0;
let devNames = {};        // "A-0" -> [naam, categorie, heeftPatch]
let devId = 0;
let synthParams = null;   // parameterwaarden uit de synth (index = NRPN-nummer)
let lastParamRev = -1, lastNameCount = -1, lastGlobalRev = -1, wasConnected = false;
let dragging = false, readWaiting = 0, dragTimer = null;
let settingsOpened = false;
const started = Date.now();

// Tijdens slepen niet verversen, anders springt de regelaar onder je vinger weg.
// Met een tijdslot, want een gemiste touchend zou het volgen anders blokkeren.
function markDragging() {
  dragging = true;
  clearTimeout(dragTimer);
  dragTimer = setTimeout(() => { dragging = false; }, 800);
}

// Scan van namen of patches: strikt één verzoek per keer, en pas verder als het
// antwoord binnen is. Twee dumps die door elkaar heen aankomen laten de
// uitpakking uit de maat lopen, met onleesbare namen als gevolg.
let libState = null, scan = null;

function scanStart(kind, items, bank) {
  scan = {kind, items, bank, i:0, mark:-1, deadline:0};
  scanStep();
}

function scanStep() {
  if (!scan) return;
  if (scan.i >= scan.items.length) {
    statusText.textContent = "scan done (" + scan.items.length + " requested)";
    scan = null;
    AndroidBridge.libSave();
    return;
  }
  const it = scan.items[scan.i++];
  scan.mark = libState ? (scan.kind === "names" ? libState.nameDumps : libState.patchDumps) : 0;
  scan.deadline = Date.now() + (scan.kind === "names" ? 6000 : 2500);
  if (scan.kind === "names") AndroidBridge.requestBankNames(it, devId);
  else AndroidBridge.requestProgram(scan.bank, it, devId);
  setTimeout(poll, 600);
}

function scanTick(lib) {
  if (!scan) return;
  const n = scan.kind === "names" ? lib.nameDumps : lib.patchDumps;
  if (n > scan.mark || Date.now() > scan.deadline) scanStep();
}

// wachtrij voor losse SysEx-verzoeken.
// Moet boven poll() staan, want poll() leest queue.length.
let queue = [], queueTimer = null;
function enqueue(fn) {
  queue.push(fn);
  if (!queueTimer) queueTimer = setInterval(() => {
    const f = queue.shift();
    if (!f) { clearInterval(queueTimer); queueTimer = null; return; }
    f();
  }, 160);
}

// ================== parameterdefinities ==================
const S = (n, l, max) => ({k:"s", n, l, max: max || 255});
const B = (n, l) => ({k:"b", n, l, max:255});
const T = (n, l) => ({k:"t", n, l, max:1});
const E = (n, l, o) => ({k:"e", n, l, o, max:o.length - 1});
const H = l => ({k:"h", l});
const CS = (cc, l, max) => ({k:"s", cc, l, max: max || 127});
const CT = (cc, l) => ({k:"t", cc, l, max:1});

const RANGE = ["16'","8'","4'"];
const MODSRC = ["Manual","LFO 1","LFO 2","VCA Env","VCF Env","Mod Env"];
const MODSEL = ["LFO 1","LFO 2","VCA Env","VCF Env","Mod Env","LFO 1 unipolar","LFO 2 unipolar"];
const PORTA = ["Normal","Fingered","Fixed rate","Fixed rate fingered","Exponential","Exp. fingered",
               "Fixed +2","Fixed -2","Fixed +5","Fixed -5","Fixed +12","Fixed -12","Fixed +24","Fixed -24"];
const SHAPE = ["Sine","Triangle","Square","Ramp up","Ramp down","Sample & Hold","Sample & Glide"];
const TRIG  = ["Key","LFO 1","LFO 2","Loop","Ctrl seq step"];
const POLY  = ["Poly","Unison 2","Unison 3","Unison 4","Unison 6","Unison 12","Mono","Mono 2",
               "Mono 3","Mono 4","Mono 6","Poly 6","Poly 8"];
const PRIO  = ["Lowest","Highest","Last"];
const ETRIG = ["Mono","Re-trigger","Legato","One-shot"];
const AMODE = ["Up","Down","Up & down","Up inv","Down inv","Up & down inv","Up alt","Down alt",
               "Random","As played","Chord"];
const ACLK  = ["1/2","3/8","1/3","1/4","3/16","1/6","1/8","3/32","1/12","1/16","1/24","1/32","1/48"];
const FXT   = ["TC-DeepVRB","AmbVerb","RoomRev","VintageRev","HallRev","ChamberRev","PlateRev",
               "RichPltRev","GatedRev","Reverse","ChorusVerb","DelayVerb","FlangVerb","MidasEQ",
               "Enhancer","FairComp","MulBndDist","RackAmp","EdisonEX1","AutoPan","NoiseGate","Delay",
               "3TapDelay","4TapDelay","T-RayDelay","DecimDelay","ModDlyRev","Chorus","Chorus-D",
               "Flanger","Phaser","MoodFilter","DualPitch","RotarySpkr"];

const fxSlot = (nr, type, p1, gain) => [
  H("FX slot " + nr), E(type, "FX " + nr + " type", FXT), S(gain, "FX " + nr + " gain", 150),
  ...Array.from({length: 12}, (_, i) => S(p1 + i, "FX " + nr + " param " + (i + 1)))
];

const PAGES = [
  {id:"osc", name:"OSC", params:[
    H("Oscillator 1"),
    E(14,"Range",RANGE), T(18,"Pulse wave"), T(19,"Sawtooth"), T(20,"OSC sync"),
    S(25,"PWM depth"), E(16,"PWM source",MODSRC),
    S(21,"Pitch mod depth"), E(22,"Pitch mod source",MODSEL),
    E(38,"Pitch mod range",["OSC 1+2","OSC 1 only"]),
    S(23,"Aftertouch → pitch"), S(24,"Mod wheel → pitch"),
    H("Oscillator 2"),
    E(15,"Range",RANGE), S(26,"Level"), S(27,"Pitch"),
    S(28,"Tone mod depth"), E(17,"Tone mod source",MODSRC),
    S(29,"Pitch mod depth"), E(32,"Pitch mod source",MODSEL),
    S(30,"Aftertouch → pitch"), S(31,"Mod wheel → pitch"),
    H("General"),
    S(33,"Noise level"), S(34,"Portamento time"), E(35,"Portamento mode",PORTA),
    S(36,"Pitch bend up",24), S(37,"Pitch bend down",24),
  ]},
  {id:"vcf", name:"Filter", params:[
    S(39,"Frequency"), S(41,"Resonance"), S(40,"High-pass (HPF)"),
    S(42,"Envelope depth"), E(50,"Envelope polarity",["Negative","Positive"]),
    E(51,"Filter poles",["4-pole","2-pole"]), T(52,"Bass boost"),
    S(49,"Key tracking"), S(43,"Envelope → velocity"),
    S(45,"LFO depth"), E(46,"LFO select",["LFO 1","LFO 2"]),
    S(47,"Aftertouch → LFO"), S(48,"Mod wheel → LFO"), S(44,"Pitch bend → frequency"),
  ]},
  {id:"env", name:"Env", params:[
    H("VCA envelope"),
    S(53,"Attack"), S(54,"Decay"), S(55,"Sustain"), S(56,"Release"), E(57,"Trigger",TRIG),
    S(80,"VCA level"), S(81,"Envelope depth"), S(82,"Velocity"), B(83,"Pan spread"),
    H("VCF envelope"),
    S(62,"Attack"), S(63,"Decay"), S(64,"Sustain"), S(65,"Release"), E(66,"Trigger",TRIG),
    H("MOD envelope"),
    S(71,"Attack"), S(72,"Decay"), S(73,"Sustain"), S(74,"Release"), E(75,"Trigger",TRIG),
  ]},
  {id:"voice", name:"Voice", params:[
    E(85,"Voice mode",POLY), E(84,"Voice priority",PRIO), E(86,"Envelope trigger",ETRIG),
    S(87,"Unison detune"), S(88,"Voice drift"), S(89,"Parameter drift"), S(90,"Drift rate"),
    B(91,"Portamento balance"), T(92,"Key down reset"),
  ]},
  {id:"lfo", name:"LFO", params:[
    H("LFO 1"),
    S(0,"Rate"), S(1,"Delay / fade"), E(2,"Shape",SHAPE), T(3,"Key sync"), T(4,"Arp sync"),

// ================== verbinding & status ==================
const led = document.getElementById("led");
const statusText = document.getElementById("statusText");
const ipInput = document.getElementById("ipInput");

// De interface mag nooit sneuvelen door een statusupdate.
function poll() {
  try { pollNow(); }
  catch (e) { statusText.textContent = "status error: " + e.message; }
}

function pollNow() {
  let s;
  try { s = JSON.parse(AndroidBridge.getStatus()); }
  catch { led.className = ""; statusText.textContent = "bridge error"; return; }

  led.className = s.connected ? "ok" : (s.wifiConnected ? "wifi" : "");
  let txt = s.connected ? "connected" : s.status;
  if (!s.connected && s.wifi) txt = s.wifi + " · " + txt;
  if (!s.connected && s.event) txt += " · " + s.event;
  if (document.activeElement !== ipInput) ipInput.value = s.ip;

  // meld je aan zodra de sessie er is: dan zet de synth NRPN + SysEx aan
  if (s.connected && !wasConnected) { AndroidBridge.appNotify(-1); }
  wasConnected = s.connected;

  // niet verbonden na een paar seconden? Dan de instellingen zelf openklappen,
  // want daar staan het IP-adres en de zoekknop.
  if (!s.connected && !settingsOpened && Date.now() - started > 7000) {
    settingsOpened = true;
    document.getElementById("settings").style.display = "block";
  }

  let lib;
  try { lib = JSON.parse(AndroidBridge.libStatus()); } catch { lib = null; }
  if (lib) {
    libState = lib;
    if (lib.dev >= 0) devId = lib.dev;
    document.getElementById("devInfo").textContent =
      "dev " + (lib.dev < 0 ? "?" : lib.dev) + (lib.iface >= 0 ? " · iface " + lib.iface : "");
    if (s.connected && lib.curBank >= 0 && lib.curProg >= 0) {
      txt += " · synth: " + BANKS[lib.curBank] + (lib.curProg + 1);
    }
    if (lib.info) txt += " · " + lib.info;
    document.getElementById("libStat").textContent =
      `names: ${lib.names}/1024 · patches: ${lib.patches} · dumps: ${lib.nameDumps}/${lib.patchDumps}`
      + (lib.badNames ? ` · unreadable: ${lib.badNames}` : "")
      + ` · sysex: ${lib.sysex} (${lib.sysexLen} bytes, ${lib.segs} segments)`
      + (lib.framing ? ` · framing errors: ${lib.framing}` : "")
      + (scan ? ` · scan ${scan.i}/${scan.items.length}` : "")
      + (queue.length ? ` · queue ${queue.length}` : "");
    if (lib.names !== lastNameCount) { lastNameCount = lib.names; loadDevNames(); }
    if (lib.paramRev !== lastParamRev) {
      lastParamRev = lib.paramRev;
      loadSynthParams();
      if (readWaiting) {
        txt = "values received from the synth · " + txt;
        readWaiting = 0;
      }
    } else if (readWaiting && Date.now() - readWaiting > 4000) {
      txt = "no reply from the synth to the read request · " + txt;
      readWaiting = 0;
    }
    scanTick(lib);
    if (isParamTab()) updateParamNote();
    if (lib.globalRev !== lastGlobalRev) { lastGlobalRev = lib.globalRev; loadGlobals(); }
    if (scan) txt = `scan ${scan.i}/${scan.items.length} · ` + txt;
  }
  statusText.textContent = txt;
}

function loadDevNames() {
  try { devNames = JSON.parse(AndroidBridge.libNames()) || {}; } catch { devNames = {}; }
  if (tab === "presets") renderGrid();
  if (tab === "lib") renderLib();
}

function loadSynthParams() {
  try {
    const p = JSON.parse(AndroidBridge.libParams());
    if (!Array.isArray(p)) return;
    // markeren wat er sinds de vorige lezing veranderde, zodat je het ziet
    if (synthParams) {
      const now = Date.now();
      for (let i = 0; i < p.length; i++) if (p[i] !== synthParams[i]) pRecent[i] = now;
    }
    synthParams = p;
    if (!dragging && isParamTab()) renderParams();
  } catch {}
}

// ================== logboek ==================
// Toont in gewone taal wat er langskomt: elk SysEx-bericht ontleed, plus de
// parameters die de synth stuurt. Tik een regel aan voor de ruwe bytes.
let logRev = -1, logOpen = false, logTimer = null, logHexOpen = {}, logHideBefore = 0;

function fmtTime(ms) {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function renderLog(force) {
  if (!logOpen) return;
  let d;
  try { d = JSON.parse(AndroidBridge.log()); } catch { return; }
  if (!force && d.rev === logRev) return;
  logRev = d.rev;
  const lines = (d.lines || []).filter(L => L.ms >= logHideBefore);
  const list = document.getElementById("logList");
  list.innerHTML = "";
  document.getElementById("logInfo").textContent = lines.length
    ? lines.length + " messages, newest first — tap a line for the raw bytes"
    : "nothing yet";
  for (const L of lines) {
    const row = document.createElement("div");
    row.className = "logline " + (L.dir || "in") + " " + (L.tag || "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = fmtTime(L.ms);
    const dir = document.createElement("span");
    dir.className = "d"; dir.textContent = L.dir === "out" ? "→" : "←";
    const msg = document.createElement("span");
    msg.className = "m"; msg.textContent = L.text;
    row.appendChild(t); row.appendChild(dir); row.appendChild(msg);
    row.addEventListener("click", () => {
      logHexOpen[L.ms] = !logHexOpen[L.ms];
      renderLog(true);
    });
    list.appendChild(row);
    if (L.hex && logHexOpen[L.ms]) {
      const h = document.createElement("div");
      h.className = "loghex";
      h.textContent = L.hex;
      list.appendChild(h);
    }
  }
}

document.getElementById("logBtn").addEventListener("click", () => {
  logOpen = !logOpen;
  document.getElementById("logPanel").style.display = logOpen ? "block" : "none";
  document.getElementById("logBtn").classList.toggle("on", logOpen);
  clearInterval(logTimer);
  logTimer = null;
  if (logOpen) {
    renderLog(true);
    logTimer = setInterval(() => renderLog(false), 600);
  }
});

document.getElementById("logCopy").addEventListener("click", () => {
  let d;

  const text = (d.lines || []).filter(L => L.ms >= logHideBefore)
    .map(L => fmtTime(L.ms) + " " + (L.dir === "out" ? "->" : "<-") + " " + L.text
              + (L.hex ? "\n    " + L.hex : "")).join("\n");

// ================== eigen dialoog ==================
// Een WebView negeert confirm() en alert(), dus die deden stilletjes niets.
// Enter is doorgaan, Escape is annuleren — in beide dialogen.
function modalKeys(onYes, onNo) {
  const handler = e => {
    if (e.key === "Enter") { if (e.preventDefault) e.preventDefault(); onYes(); }
    else if (e.key === "Escape") { if (e.preventDefault) e.preventDefault(); onNo(); }
  };
  document.addEventListener("keydown", handler);
  return () => document.removeEventListener("keydown", handler);
}

function ask(msg) {
  return new Promise(res => {
    const m = document.getElementById("modal");
    document.getElementById("modalText").textContent = msg;
    document.getElementById("modalInput").style.display = "none";
    m.style.display = "flex";
    let off = null;
    const done = v => { if (off) off(); m.style.display = "none"; res(v); };
    off = modalKeys(() => done(true), () => done(false));
    document.getElementById("modalYes").onclick = () => done(true);
    document.getElementById("modalNo").onclick = () => done(false);
  });
}

/** Vraagt om tekst; geeft null terug bij annuleren. */
function askText(msg, initial) {
  return new Promise(res => {
    const m = document.getElementById("modal");
    const inp = document.getElementById("modalInput");
    document.getElementById("modalText").textContent = msg;
    inp.style.display = "block";
    inp.value = initial || "";
    m.style.display = "flex";
    inp.focus();
    if (inp.select) inp.select();
    let off = null;
    const done = v => {
      if (off) off();
      m.style.display = "none";
      inp.style.display = "none";
      res(v);
    };
    off = modalKeys(() => done(inp.value), () => done(null));
    document.getElementById("modalYes").onclick = () => done(inp.value);
    document.getElementById("modalNo").onclick = () => done(null);
  });
}

function tell(msg) {
  const m = document.getElementById("modal");
  document.getElementById("modalText").textContent = msg;
  document.getElementById("modalInput").style.display = "none";
  m.style.display = "flex";
  const close = () => { m.style.display = "none"; };
  document.getElementById("modalYes").onclick = close;
  document.getElementById("modalNo").onclick = close;
}

function buildTabs() {
  const t = document.getElementById("tabs");
  t.innerHTML = "";

               ...PAGES, {id:"global", name:"Global"}];

    t.appendChild(b);
  }

function isParamTab() { return PAGES.some(p => p.id === tab); }

function showTab() {
  buildTabs();
  document.getElementById("page-presets").style.display = tab === "presets" ? "block" : "none";
  document.getElementById("page-lib").style.display = tab === "lib" ? "block" : "none";
  document.getElementById("page-global").style.display = tab === "global" ? "block" : "none";

  // instellingen snel. Buiten die tab hoeft er niet gepolst te worden.

    AndroidBridge.requestGlobals(devId);

}

// ================== presets ==================
const grid = document.getElementById("grid");
const search = document.getElementById("search");

function progLabel(b, p) {
  const k = b + "-" + p;
  if (names[k]) return names[k];
  const d = devNames[k];
  if (d && d[0]) return d[0];
  return "Preset " + b + (p + 1);
}
function progCat(b, p) {
  const d = devNames[b + "-" + p];
  return d && d[1] > 0 ? CATS[d[1]] || "" : "";
}

function buildBankTabs(el, sel, onPick, withFav) {
  el.innerHTML = "";
  const list = withFav ? BANKS.concat(["FAV"]) : BANKS;
  for (const b of list) {
    const btn = document.createElement("button");
    const isFav = b === "FAV";
    btn.className = "bank-btn" + (isFav ? " fav" : "") + (sel === b ? " sel" : "");
    btn.textContent = isFav ? "★" : b;
    btn.addEventListener("click", () => onPick(b));
    el.appendChild(btn);
  }
}

function visibleProgs() {
  const q = search.value.trim().toLowerCase();
  const out = [];
  if (q) {
    for (const b of BANKS) for (let p = 0; p < PROGS; p++) {
      const lab = progLabel(b, p).toLowerCase();
      if (lab.includes(q) || (b + (p + 1)).toLowerCase() === q) out.push([b, p]);
    }
    return out;
  }
  if (curBank === "FAV") {
    for (const k of favs) { const [b, p] = k.split("-"); out.push([b, +p]); }
    out.sort((x, y) => x[0] === y[0] ? x[1] - y[1] : BANKS.indexOf(x[0]) - BANKS.indexOf(y[0]));
    return out;
  }
  for (let p = 0; p < PROGS; p++) out.push([curBank, p]);
  return out;
}

let pressTimer = null, longPressed = false;

function renderGrid() {
  buildBankTabs(document.getElementById("bankTabs"), curBank,
    b => { curBank = b; store.save("dm12.bank", b); search.value = ""; renderGrid(); }, true);
  grid.innerHTML = "";
  const progs = visibleProgs();
  if (!progs.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = curBank === "FAV" && !search.value
      ? "No favourites yet — tap the ★ on a preset." : "No presets found.";
    grid.appendChild(d);
    return;
  }
  for (const [bank, prog] of progs) {
    const key = bank + "-" + prog;
    const div = document.createElement("div");
    div.className = "prog" + (current === key ? " current" : "");
    div.dataset.key = key;

    const num = document.createElement("div");
    num.className = "num";
    num.textContent = bank + String(prog + 1).padStart(3, "0");
    div.appendChild(num);

    const nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = progLabel(bank, prog);
    if (!names[key] && !(devNames[key] && devNames[key][0])) nm.style.color = "var(--muted)";
    div.appendChild(nm);

    const cat = progCat(bank, prog);
    if (cat) {
      const c = document.createElement("div");
      c.className = "cat"; c.textContent = cat; div.appendChild(c);
    }

    const star = document.createElement("span");
    star.className = "star" + (favs.has(key) ? " on" : "");
    star.textContent = "★";
    star.addEventListener("click", e => {
      e.stopPropagation();
      favs.has(key) ? favs.delete(key) : favs.add(key);
      store.save("dm12.favs", [...favs]);
      renderGrid();
    });
    div.appendChild(star);

    const start = () => {
      longPressed = false;
      pressTimer = setTimeout(() => { longPressed = true; rename(div, key, bank, prog); }, 550);
    };
    const stop = () => clearTimeout(pressTimer);
    div.addEventListener("touchstart", start, {passive:true});
    div.addEventListener("touchend", stop);
    div.addEventListener("touchmove", stop, {passive:true});
    div.addEventListener("mousedown", start);
    div.addEventListener("mouseup", stop);
    div.addEventListener("mouseleave", stop);
    div.addEventListener("click", () => { if (!longPressed) sendProgram(bank, prog); });
    div.addEventListener("contextmenu", e => e.preventDefault());
    grid.appendChild(div);
  }
}

function sendProgram(bank, prog) {
  const ok = AndroidBridge.send(BANKS.indexOf(bank), prog, channel);
  if (ok) {
    current = bank + "-" + prog;
    store.save("dm12.current", current);
    statusText.textContent = "sent: " + bank + (prog + 1);
    for (const el of document.querySelectorAll(".prog")) {
      el.classList.toggle("current", el.dataset.key === current);
    }
    // parameters van het nieuwe programma ophalen
    setTimeout(() => AndroidBridge.requestEditBuffer(devId), 250);
  } else {
    statusText.textContent = "not connected to the synth";
  }
}

function rename(div, key, bank, prog) {
  const el = div.querySelector(".name");
  const input = document.createElement("input");
  input.type = "text";
  input.value = names[key] || "";
  input.placeholder = progLabel(bank, prog);
  el.innerHTML = ""; el.appendChild(input);
  input.focus();
  const fin = save => {
    if (save) {
      const v = input.value.trim();
      v ? names[key] = v : delete names[key];
      store.save("dm12.names", names);
    }
    renderGrid();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") fin(true);
    if (e.key === "Escape") fin(false);
    e.stopPropagation();
  });
  input.addEventListener("blur", () => fin(true));
  input.addEventListener("click", e => e.stopPropagation());
}

search.addEventListener("input", renderGrid);
document.getElementById("backupBtn").addEventListener("click", () =>
  AndroidBridge.copyToClipboard(JSON.stringify({names, favs:[...favs], vals})));
document.getElementById("restoreBtn").addEventListener("click", async () => {
  try {
    // await: op Android komt er tekst terug, in de browser een belofte
    const d = JSON.parse(await AndroidBridge.readClipboard());
    if (d.names) names = d.names;
    if (Array.isArray(d.favs)) favs = new Set(d.favs);
    if (d.vals) vals = d.vals;
    store.save("dm12.names", names); store.save("dm12.favs", [...favs]); store.save("dm12.vals", vals);
    renderGrid();
    statusText.textContent = "backup restored from the clipboard";
  } catch { tell("No valid backup found on the clipboard."); }
});

// ================== parameters ==================
// Laat zien of de synth ook echt iets terugstuurt. Zonder dit is niet te zien
// of het aan de app ligt of aan een instelling op de synth.
function updateParamNote() {
  const el = document.getElementById("paramNote");
  if (!el) return;
  let t = synthParams ? "values from the synth" : "not read yet";
  if (autoSync) t += " · auto on";
  if (libState) {
    if (libState.rxPar > 0) t += " · synth is sending: " + libState.rxLast;
    else if (libState.rxCC > 0) t += " · synth is sending CCs: " + libState.rxLast;
    else t += " · synth sends nothing (set its WiFi mode to NRPN)";
  }
  el.textContent = t;
}

function pkey(p) { return p.n !== undefined ? "n" + p.n : "c" + p.cc; }
function pval(p) {
  if (p.n !== undefined && synthParams && p.n < synthParams.length && vals[pkey(p)] === undefined) {
    return synthParams[p.n];
  }
  const v = vals[pkey(p)];
  return v === undefined ? (p.k === "s" ? Math.round(p.max / 2) : 0) : v;
}
function fmt(p, v) {
  if (p.k === "e") return p.o[v] !== undefined ? p.o[v] : v;
  if (p.k === "t") return v ? "on" : "off";
  if (p.k === "b") return (v - 128 > 0 ? "+" : "") + (v - 128);
  return String(v);
}
function doSend(p, v) {
  vals[pkey(p)] = v;
  const ok = p.n !== undefined
    ? AndroidBridge.sendNRPN(p.n, v, channel)
    : AndroidBridge.sendCC(p.cc, v, channel);
  if (synthParams && p.n !== undefined && p.n < synthParams.length) synthParams[p.n] = v;
  return ok;
}
let saveTimer = null;
function sendParam(p, v) {
  doSend(p, v);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.save("dm12.vals", vals), 800);
}

function renderParams() {
  const page = PAGES.find(x => x.id === tab);
  const wrap = document.getElementById("paramList");
  updateParamNote();
  wrap.innerHTML = "";
  if (!page) return;
  for (const p of page.params) {
    if (p.k === "h") {
      const h = document.createElement("div");
      h.className = "phead"; h.textContent = p.l; wrap.appendChild(h);
      continue;
    }
    const v = pval(p);
    const box = document.createElement("div");
    const fresh = p.n !== undefined && pRecent[p.n]
                  && Date.now() - pRecent[p.n] < HILITE_MS;
    box.className = "p" + (fresh ? " changed" : "");
    const lab = document.createElement("div");
    lab.className = "plab";
    const ls = document.createElement("span"); ls.textContent = p.l;
    const vs = document.createElement("span"); vs.className = "pval"; vs.textContent = fmt(p, v);
    lab.appendChild(ls); lab.appendChild(vs);
    box.appendChild(lab);

    if (p.k === "e") {
      const sel = document.createElement("select");
      p.o.forEach((o, i) => {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = o; sel.appendChild(opt);
      });
      sel.value = Math.min(v, p.max);
      sel.addEventListener("change", () => {
        const nv = +sel.value; vs.textContent = fmt(p, nv); sendParam(p, nv);
      });
      box.appendChild(sel);
    } else if (p.k === "t") {
      const btn = document.createElement("button");
      btn.className = "tog" + (v ? " on" : "");
      btn.textContent = v ? "on" : "off";
      btn.addEventListener("click", () => {
        const nv = btn.classList.contains("on") ? 0 : 1;
        btn.classList.toggle("on", !!nv);
        btn.textContent = nv ? "on" : "off";
        vs.textContent = fmt(p, nv);
        sendParam(p, nv);
      });
      box.appendChild(btn);
    } else {
      const r = document.createElement("input");
      r.type = "range"; r.min = 0; r.max = p.max; r.value = v;
      let t = null;
      r.addEventListener("input", () => {
        const nv = +r.value;
        vs.textContent = fmt(p, nv);
        markDragging();
        if (!t) t = setTimeout(() => { t = null; doSend(p, +r.value); }, 25);
      });
      const fin = () => {
        dragging = false;
        clearTimeout(dragTimer);
        clearTimeout(t); t = null;
        sendParam(p, +r.value);
      };
      r.addEventListener("change", fin);
      r.addEventListener("touchend", fin);
      box.appendChild(r);
    }
    wrap.appendChild(box);
  }
}

// korte visuele bevestiging op de knop zelf
function flash(el, ok) {
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), ok ? 220 : 600);
}

const readBtn = document.getElementById("readBtn");
readBtn.addEventListener("click", () => {
  AndroidBridge.appNotify(devId);
  const ok = AndroidBridge.requestEditBuffer(devId);
  flash(readBtn, ok);
  statusText.textContent = ok ? "edit buffer requested, waiting for a reply…"
                              : "not connected — nothing to request";
  readWaiting = ok ? Date.now() : 0;
});

const pushBtn = document.getElementById("pushBtn");
pushBtn.addEventListener("click", () => {
  const page = PAGES.find(x => x.id === tab);
  if (!page) { statusText.textContent = "open a parameter tab first"; return; }
  let n = 0, ok = true;
  for (const p of page.params) {
    if (p.k === "h") continue;
    if (doSend(p, pval(p)) === false) ok = false;
    n++;
  }
  flash(pushBtn, ok);

                              : "not connected — nothing sent";
});

// Auto: blijft de synth volgen door de edit buffer periodiek op te vragen.
// Wijzigingen in de app gaan altijd al direct naar de synth.
const autoBtn = document.getElementById("autoBtn");
let autoSync = store.load("dm12.auto", true);   // standaard aan: de app volgt de synth

// ================== bibliotheek ==================
function renderLib() {
  buildBankTabs(document.getElementById("libBanks"), BANKS[libBank],
    b => { libBank = BANKS.indexOf(b); renderLib(); }, false);
  const list = document.getElementById("libList");
  list.innerHTML = "";
  const bl = BANKS[libBank];
  for (let p = 0; p < PROGS; p++) {
    const key = bl + "-" + p;
    const d = devNames[key];
    const row = document.createElement("div");
    row.className = "lrow";

    const num = document.createElement("span");
    num.className = "lnum"; num.textContent = bl + String(p + 1).padStart(3, "0");
    row.appendChild(num);

    const nm = document.createElement("span");
    nm.className = "lname";
    nm.textContent = d && d[0] ? d[0] : "—";
    if (!d || !d[0]) nm.style.color = "var(--muted)";
    row.appendChild(nm);

    if (d && d[1] > 0) {
      const c = document.createElement("span");
      c.className = "lcat"; c.textContent = CATS[d[1]] || ""; row.appendChild(c);
    }

    const dot = document.createElement("span");
    dot.className = "dotp" + (d && d[2] ? " has" : "");
    dot.title = "patch stored"; row.appendChild(dot);

    const get = document.createElement("button");
    get.className = "mini"; get.textContent = "⤓";
    get.title = "fetch this patch from the synth";
    get.addEventListener("click", () => {
      enqueue(() => AndroidBridge.requestProgram(libBank, p, devId));
    });
    row.appendChild(get);

    const load = document.createElement("button");
    load.className = "mini"; load.textContent = "▶";
    load.title = "audition the stored patch (edit buffer)";
    load.addEventListener("click", () => {
      if (!AndroidBridge.patchToEditBuffer(libBank, p, devId)) {
        statusText.textContent = "no patch stored for " + key;
      } else {
        statusText.textContent = key + " to edit buffer";
      }
    });
    row.appendChild(load);

    const wr = document.createElement("button");
    wr.className = "mini"; wr.textContent = "⤴";
    wr.title = "write the stored patch back to this slot";
    wr.addEventListener("click", async () => {
      const ok = await ask("Write the stored patch back to " + key + "?\n\n"
        + "This overwrites the program currently in that slot of the synth.");
      if (!ok) return;
      const done = AndroidBridge.patchToSlot(libBank, p, libBank, p, devId);
      flash(wr, done);
      statusText.textContent = done ? key + " written back"
                                    : "no patch stored for " + key;
    });
    row.appendChild(wr);

    list.appendChild(row);
  }
}
